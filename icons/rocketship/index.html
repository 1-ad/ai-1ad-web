<!DOCTYPE html>
<html lang=en>
<head>
<title>rocketship</title>
<meta name=ad.size content="width=160,height=200">
<meta name=format-detection content="telephone=no">
<meta charset=UTF-8>
<script src=../../js/shared.js></script>
<script src=banner.js></script>
<script>var adMaxTime=60000;var canvasWidth=160;var canvasHeight=160;var canvasLeft=0;var canvasTop=40;var gotoRad=0;var shipRad=0;var shipDeg=0;var shipEase=0.95;window.onload=function(){initEffects();requestTimeout(bannerStart,250)};function onMouseUpdate(a){gotoRad=a.mouseRatioX}function onUpdateShip(){shipRad=shipRad*shipEase+gotoRad*(1-shipEase);shipDeg=shipRad*(180/Math.PI);if(adCanAnimate==true){gEL("#ship").style.webkitTransform="rotate("+shipDeg+"deg)";gEL("#ship").style.mozTransform="rotate("+shipDeg+"deg)";gEL("#ship").style.msTransform="rotate("+shipDeg+"deg)";gEL("#ship").style.oTransform="rotate("+shipDeg+"deg)";gEL("#ship").style.transform="rotate("+shipDeg+"deg)"}}function bannerStart(){var a=0;requestTimeout(function(){gEL("#banner").className="adsize fadein trans250"},a)};</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,img,canvas{position:absolute;transform:translatez(0);backface-visibility:hidden;background-position:0 0;background-size:cover;pointer-events:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important;-webkit-tap-highlight-color:rgba(0,0,0,0)!important;-webkit-touch-callout:none!important}#banner{background-color:#aaa;overflow:hidden;pointer-events:all}.adsize{left:0;top:0;width:160px;height:200px}#bkgrnd{width:160px;height:160px;left:0;top:40px;background:#1430ec;background:-moz-linear-gradient(top,#1430ec 0,#6ed6fb 100%);background:-webkit-linear-gradient(top,#1430ec 0,#6ed6fb 100%);background:linear-gradient(to bottom,#1430ec 0,#6ed6fb 100%);filter:progid:DXImageTransform.Microsoft.gradient(startColorstr='#1430ec',endColorstr='#6ed6fb',GradientType=0)}#renderCanvas{width:160px;height:160px;left:0;top:40px}#cover{background-image:url("cover.png")}#ship{width:160px;height:140px;left:0;top:0;transform-origin:80px 110px;background-image:url("ship.png")}.fadein{opacity:1;visibility:visible}.fadeout{opacity:0;visibility:hidden}.trans250{-webkit-transition:all 250ms ease-in-out;-moz-transition:all 250ms ease-in-out;-o-transition:all 250ms ease-in-out;transition:all 250ms ease-in-out}</style>
</head>
<body>
<img src=fire.png alt style=display:none />
<div id=banner class="adsize fadeout">
<div id=bkgrnd class=adsize></div>
<canvas id=renderCanvas width=160 height=160></canvas>
<div id=cover class=adsize></div>
<div id=ship></div>
</div>
</body>
</html>
