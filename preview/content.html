<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<title></title>
<style type=text/css>body{vertical-align:baseline;border:0 none;outline:0;padding:0;margin:0;left:0;top:0;width:100%;height:100%;background-color:#000}div{position:absolute;user-select:none;background-position:0 0;background-size:cover;background-repeat:no-repeat;transform-origin:0 0;backface-visibility:hidden;pointer-events:none;overflow:hidden}#ad-container{overflow:hidden;visibility:hidden;background-color:#000}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:640px;height:360px;left:0;top:0}.video{width:100%;height:100%;pointer-events:auto;cursor:pointer}video::-webkit-media-controls-fullscreen-button{display:none!important}.video-container{background-color:#000}</style>
</head>
<body>
<div id=ad-container class=adsize>
<div id=primary-video-container class="video-container adsize">
<video id=primary-video class=video src=content.mp4 poster=content.jpg autoplay playsinline controls></video>
</div>
<div id=border class=adsize></div>
</div>
<script type=text/javascript>window.addEventListener("load",onAdInit);function onAdInit(){initVideo();onWindowResize();gEL("#ad-container").style.visibility="visible"}function initVideo(){gEL("#primary-video").addEventListener("ended",function(){});gEL("#primary-video").play()}window.addEventListener("resize",onWindowResize);function onWindowResize(){resizeCreative(window.innerWidth,window.innerHeight)}function resizeCreative(b,d,e){var g=640;var f=360;var b=window.innerWidth;var d=window.innerHeight;var a=Math.min(b/g,d/f);var c=Math.round((b-(g*a))/2);var h=Math.round((d-(f*a))/2);gEL("#ad-container").style.transform="scale("+a+", "+a+")";gEL("#ad-container").style.left=c+"px";gEL("#ad-container").style.top=h+"px"}function gEL(a){return document.querySelector(a)};</script>
</body>
</html>
