<script>var isPlaying;var max15TO;window.onload=function(){gEL("#banner").addEventListener("click",onBannerClick);gEL("#banner").addEventListener("mouseover",onBannerOver);startAnimation();checkVisibility()};function onBannerClick(a){window.open("https://www.drpepper.com/","_blank")}function resetBanner(){gEL("#logo").className="fadeout";gEL("#tagline").className="tagline_off fadeout";gEL("#cta").className="fadeout";gEL("#product").className="product_off fadeout";gEL("#bkgrnd").className="adsize"}function startAnimation(){clearAllRequestTimeouts();resetBanner();initParticles();gEL("#banner").className="adsize";var a=0;requestTimeout(function(){gEL("#tagline").className="trans1000out";gEL("#product").className="trans1000out"},a);a+=1000;requestTimeout(function(){showParticles();playAnimation()},a);a+=1500;requestTimeout(function(){gEL("#cta").className="boingInUp"},a);a+=500;requestTimeout(function(){gEL("#logo").className="tinUpIn"},a)}var canvasWidth=160;var canvasHeight=600;var canvasOver;var canvasUnder;var frameRate=1/24;var frameDelay=Math.round(frameRate*1000);var renderInterval;var renderAR=[];var startX=canvasWidth*0.5;var startY=570;var growY=1.0045;function initParticles(){canvasOver=document.getElementById("canvas_over").getContext("2d");canvasUnder=document.getElementById("canvas_under").getContext("2d");renderAR=[];var c=100;for(var b=1;b<=c;b++){buildParticle(b,c)}}function buildParticle(f,d){var e={};e.size=numRange(2,8);e.color="rgb(255,255,255)";e.opacity=numRange(3,7)/10;e.jitterX=numRange(-10,10);e.jitterY=numRange(-40,20);e=resetParticle(e);var c=Math.round(f/d*141);e.start=c*-0.1;e.visible=0;for(var b=1;b<=c;b++){e.gravity*=growY;e.y=e.y-e.gravity}renderAR.push(e)}function resetParticle(a){a.x=startX;a.y=startY;a.start=0;a.gravity=3;a.scale=0;a.layer=0.5;return a}var showNum=0;function showParticles(){var a=renderAR[showNum];a.visible=1;showNum++;if(showNum<renderAR.length){requestTimeout(showParticles,50)}}function moveParticles(){var c;for(var <style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,img,canvas{background-position:0 0;background-size:cover;position:absolute;pointer-events:none}#banner{overflow:hidden;background:linear-gradient(#882434,#500114)}#banner{pointer-events:all;cursor:pointer;background-color:#dff6fe}#border{top:0;left:0;width:100%;height:100%;box-sizing:border-box;-moz-box-sizing:border-box;-webkit-box-sizing:border-box;border:1px solid #000}.adsize{left:0;top:0;width:160px;height:600px}#bkgrnd{background-image:url("bkgrnd.jpg")}#tagline{left:15px;top:128px;width:130px;height:86px;background-image:url("tagline.png");transform-origin:50% 100%}.tagline_off{-webkit-transform:scale(.2) translate(0%,200%);transform:scale(.2) translate(0%,200%)}#logo{left:0;top:10px;width:160px;height:118px;background-image:url("logo.png")}#product{width:274px;height:338px;left:-57px;top:252px;background-image:url("product.png")}.product_off{-webkit-transform:translate(0px,-30px) scale(.6);transform:translate(0px,-30px) scale(.6)}#cta{width:122px;height:36px;left:20px;top:244px;border:1px solid #fff;-webkit-box-shadow:0 5px 10px 0 rgba(0,0,0,0.3);-moz-box-shadow:0 5px 10px 0 rgba(0,0,0,0.3);box-shadow:0 5px 10px 0 rgba(0,0,0,0.3)}.cta_off{-webkit-transform:translate(0px,-30px) scale(.6);transform:translate(0px,-30px) scale(.6)}#cta_img{width:122px;height:36px;left:0;top:0;background-position:0 0;background-image:url("cta.png");background-color:#d80045;pointer-events:all}#cta_img:hover{background-position:0 -36px;background-color:#fff}.fadein{opacity:1;visibility:visible}.fadeout{opacity:0;visibility:hidden}.trans100{-webkit-transition:all 100ms ease-in-out;-moz-transition:all 100ms ease-in-out;-o-transition:all 100ms ease-in-out;transition:all 100ms ease-in-out}.trans500{-webkit-transition:all 500ms ease-in-out;-moz-transition:all 500ms ease-in-out;-o-transition:all 500ms ease-in-out;transition:all 500ms ease-in-out}.trans1000{-webkit-transitio
