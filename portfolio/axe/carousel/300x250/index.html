<!DOCTYPE html>
<html lang=en>
<head>
<title>300x250</title>
<meta name=ad.size content="width=300,height=250">

<script>var clickTag="https://www.axe.com/us/en/products/fragrance.html";window.onload=function(){gEL("#banner").addEventListener("click",onBannerClick);gEL("#banner").addEventListener("mouseover",onBannerOver);gEL("#banner").addEventListener("mouseout",onBannerOut);gEL("#banner").addEventListener("mousemove",onBannerMove);initProducts()};function onBannerClick(a){window.open(clickTag)}function startAnimation(){startBannerTimer();gEL("#banner").className="adsize"}var canvasScale=2;var canvasWidth=300*canvasScale;var canvasHeight=250*canvasScale;var canvasContext;var frameRate=1/24;var frameDelay=Math.round(frameRate*1000);var renderInterval;var renderAR=[];var imagesAR=["product_black.png","product_essence.png","product_excite.png","product_harmony.png","product_kilo.png"];var imagesLoaded;function initProducts(){gEL("#canvas").width=canvasWidth;gEL("#canvas").height=canvasHeight;gEL("#canvas").style.width=canvasWidth/canvasScale+"px";gEL("#canvas").style.height=canvasHeight/canvasScale+"px";canvasContext=document.getElementById("canvas").getContext("2d");imagesLoaded=0;renderAR=[];var d=((Math.PI*2)/imagesAR.length);var c;for(var b in imagesAR){c={};c.src=imagesAR[b];c=loadImage(c);c.angle=b*d}}function loadImage(b){b.x=0;b.y=0;b.width=80*canvasScale;b.height=190*canvasScale;b.scale=1;var a=new Image();a.onload=function(){imageLoaded()};a.src=b.src;b.img=a;renderAR.push(b);return b}function imageLoaded(){imagesLoaded++;if(imagesLoaded==renderAR.length){startAnimation()}}var carouselCenterX=(canvasWidth/2);var carouselCenterY=(canvasHeight/2);var carouselRadiusX=100*canvasScale;var carouselRadiusY=40*canvasScale;var carouselPerspective=50;var carouselSpeed=0.05;var carouselCurrentSpeed=0.01;function moveCarousel(){var c;for(var b in renderAR){c=renderAR[b];c.angle+=carouselCurrentSpeed;c.x=Math.cos(c.angle)*carouselRadiusX+carouselCenterX;c.y=Math.sin(c.angle)*carouselRadiusY+carouselCenterY;var d=(c.y-carouselPerspective)/(carouselCenterY+carouselRadiusY-carouselPerspective);c.scale=d}renderAR.sort(productSize)}function productSize(d,c){if(d.scale<c.scale){return -1}if(d.scale>c.scale){return 1}return 0}function startRender(){onRender();stopRender();renderInterval=setInterval(onRender,frameDelay)}function stopRender(){clearInterval(renderInterval)}function onRender(){moveCarousel();canvasContext.clearRect(0,0,canvasWidth,canvasHeight);var g,d,b,f,e;for(var c in renderAR){g=renderAR[c];d=g.width*g.scale;b=g.height*g.scale;f=g.x-(d/2);e=g.y-(b*1)+(35*canvasScale);canvasContext.drawImage(g.img,f,e,d,b)}}var isPlaying;var isMouseOver;var bannerTimerTO;function startBannerTimer(){if(isPlaying!=true){isPlaying=true;startRender()}stopBannerTimer();bannerTimerTO=setTimeout(doBannerTimer,15000)}function stopBannerTimer(){if(bannerTimerTO){clearTimeout(bannerTimerTO)}bannerTimerTO=null}function doBannerTimer(){stopBannerTimer();if(isMouseOver!=true){isPlaying=false;stopRender()}}function onBannerOver(a){isMouseOver=true;startBannerTimer()}function onBannerOut(a){isMouseOver=false;startBannerTimer()}function onBannerMove(c){isMouseOver=true;var a=getMousePos(gEL("#canvas"),c);var b=(a.x-(carouselCenterX/canvasScale))/(carouselCenterX/canvasScale);carouselCurrentSpeed=b*carouselSpeed}function gEL(a){return document.querySelector(a)}function getMousePos(b,a){var c=b.getBoundingClientRect();return{x:a.clientX-c.left,y:a.clientY-c.top}};</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,img,canvas{background-position:0 0;background-size:cover;position:absolute;pointer-events:none}#banner{overflow:hidden}#banner{pointer-events:all;cursor:pointer;background-color:#fff}#border{top:0;left:0;width:100%;height:100%;box-sizing:border-box;-moz-box-sizing:border-box;-webkit-box-sizing:border-box;border:1px solid #000}.adsize{left:0;top:0;width:300px;height:250px}#footer{width:300px;height:40px;left:0;top:210px;background-image:url("footer.png")}#cta{width:72px;height:24px;left:213px;top:7px;border:1px solid #c8a676;background-image:url("cta.png");pointer-events:all;cursor:pointer}#cta:hover{background-color:#c8a676}.fadein{opacity:1;visibility:visible}.fadeout{opacity:0;visibility:hidden}.trans100{-webkit-transition:all 100ms ease-in-out;-moz-transition:all 100ms ease-in-out;-o-transition:all 100ms ease-in-out;transition:all 100ms ease-in-out}.trans500{-webkit-transition:all 500ms ease-in-out;-moz-transition:all 500ms ease-in-out;-o-transition:all 500ms ease-in-out;transition:all 500ms ease-in-out}.trans1000{-webkit-transition:all 1000ms ease-in-out;-moz-transition:all 1000ms ease-in-out;-o-transition:all 1000ms ease-in-out;transition:all 1000ms ease-in-out}.trans1000out{-webkit-transition:all 1000ms ease-out;-moz-transition:all 1000ms ease-out;-o-transition:all 1000ms ease-out;transition:all 1000ms ease-out}</style>
</head>

</div>

</div>
