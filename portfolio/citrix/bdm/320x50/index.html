<script>var clickTag="https://www.citrix.com";window.onload=function(){initMouseEvents();resetBanner();resetReveal();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1});startAnimation();}

startY+=h;}
TweenLite.to(this,1+delay,{onUpdate:onRender});function onRender(){renderContext.clearRect(0,0,canvasWidth,canvasHeight);for(var a in renderAR){var imgOb=renderAR[a];var linearGradient=renderContext.createLinearGradient(imgOb.x,imgOb.y,imgOb.x+imgOb.w,imgOb.y+imgOb.h);if(debug){var color=isEven(a)?"255,0,255":"0,255,0";linearGradient.addColorStop(0,"rgba("+color+", .5)");linearGradient.addColorStop(1,"rgba("+color+", .5)");}else{linearGradient.addColorStop(0,"rgba(0, 0, 0, 1)");linearGradient.addColorStop(0.5,"rgba(0, 0, 0, 1)");linearGradient.addColorStop(1,"rgba(0, 0, 0, 0)");}

tempContext.fillStyle=linearGradient;tempContext.fillRect(imgOb.x,imgOb.y,imgOb.w,imgOb.h);tempContext.restore();renderContext.drawImage(tempCanvas,0,0,canvasWidth,canvasHeight);if(debug){renderContext.drawImage(imgOb.img,0,0,canvasWidth,canvasHeight);}}}}
function gEL(id){return document.querySelector(id);}
function add(accumulator,a){return accumulator+a;}
function copyObject(src){return Object.assign({},src);}
function isEven(n){return n==parseFloat(n)?!(n%2):void 0;}
function bindEvent(el,eventName,eventHandler){if(el.addEventListener){el.addEventListener(eventName,eventHandler,false);}else if(el.attachEvent){el.attachEvent("on"+eventName,eventHandler);}}</script>
