<script>var clickTag="https://www.ofx.com/";var canvasWidth=970;var canvasHeight=250;window.onload=function(){initMouseEvents();resetBanner();resetReveal();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1});startAnimation();}

function onBannerClick(e){window.open(clickTag);}
var logoWidth;var symbolsHeight;var globeWidth;function resetBanner(){logoWidth=gEL("#logo").offsetWidth;symbolsHeight=gEL("#symbols").offsetHeight;globeWidth=gEL("#symbols_globe_img").offsetWidth;TweenLite.set("#bkgrnd",{scale:1.3});TweenLite.set("#txt0",{autoAlpha:0});TweenLite.set("#box3",{x:"100%",y:"0%"});TweenLite.set("#logo1",{autoAlpha:0,x:112,rotation:"180deg"});TweenLite.set("#logo2",{autoAlpha:0,x:-28,backgroundPositionX:"-100%"});TweenLite.set("#logo3",{x:logoWidth});TweenLite.set("#logo4",{x:logoWidth});var pathLength=565;gEL("#symbols_circle").style.strokeDasharray=pathLength;gEL("#symbols_circle").style.strokeDashoffset=pathLength;TweenLite.set("#symbols_circle",{rotation:"-90deg"});TweenLite.set("#symbols",{autoAlpha:0,scale:0,rotation:"0deg"});TweenLite.set("#symbols_globe_img",{x:"-100%"});var chartLength=329;gEL("#chart").style.strokeDasharray=chartLength;gEL("#chart").style.strokeDashoffset=chartLength;TweenLite.set("#cta",{autoAlpha:0,scale:0});}
function startAnimation(){var delay=0.5;TweenLite.to("#chart",4,{css:{"stroke-dashoffset":0},delay:delay,ease:Linear.easeNone});TweenLite.to("#txt0",0.5,{autoAlpha:1,delay:delay});TweenLite.to("#logo1",0.2,{autoAlpha:1,delay:delay});TweenLite.to("#logo1",0.8,{x:0,rotation:"0deg",delay:delay,ease:Quad.easeOut});TweenLite.to("#logo2",0.4,{x:0,autoAlpha:1,backgroundPositionX:"0px",delay:delay+0.2,ease:Quad.easeOut});delay+=0.25;TweenLite.to("#logo3",0.5,{x:0,delay:delay,ease:Quad.easeOut});delay+=0.25;TweenLite.to("#logo4",0.5,{x:0,delay:delay,ease:Quad.easeOut});delay+=1;TweenLite.to("#bkgrnd",0.5,{scale:1,delay:delay,ease:Quad.easeInOut});delay+=0.5;TweenLite.delayedCall(delay,function(){revealText(txtAR[1]);});delay+=3;TweenLite.delayedCall(delay,function(){hideText(txtAR[1]);});delay+=0.25;TweenLite.delayedCall(delay,function(){revealText(txtAR[2]);});delay+=3;TweenLite.delayedCall(delay,function(){hideText(txtAR[2]);});TweenLite.to("#box3",0.5,{x:"0%",y:"0%",delay:delay,ease:Quad.easeOut});delay+=0.25;TweenLite.delayedCall(delay,function(){revealText(txtAR[3]);});delay+=0.5;TweenLite.to("#symbols",0.5,{autoAlpha:1,scale:1,delay:delay,ease:Back.easeOut});delay+=0.5;TweenLite.to("#symbols_circle",2,{css:{"stroke-dashoffset":0},delay:delay,ease:Quad.easeInOut});TweenLite.to("#symbols",2,{rotation:"360deg",delay:delay,ease:Quad.easeInOut});delay+=0.5;TweenLite.set("#symbols",{backgroundPositionY:-(symbolsHeight*1)+"px",delay:delay});delay+=0.5;TweenLite.set("#symbols",{backgroundPositionY:-(symbolsHeight*2)+"px",delay:delay});delay+=0.5;TweenLite.set("#symbols",{backgroundPositionY:-(symbolsHeight*3)+"px",delay:delay});delay+=0.5;TweenLite.to("#symbols_globe_img",1,{x:"0%",delay:delay,ease:Quad.easeInOut});TweenLite.to("#symbols",1,{backgroundPositionX:globeWidth+"px",delay:delay,ease:Quad.easeInOut});delay+=1;TweenLite.to("#cta",0.5,{autoAlpha:1,scale:1,delay:delay,ease:Quad.easeOut});console.log("TOTAL BANNER ANIMATION SECONDS: "+delay);}
var scale=2;var msgWidth=970;var msgHeight=250;var canvasWidth=msgWidth*scale;var canvasHeight=msgHeight*scale;var tempCanvas=document.createElement("canvas");tempCanvas.width=canvasWidth;tempCanvas.height=canvasHeight;var tempContext=tempCanvas.getContext("2d");var txtAR;function resetReveal(){txtAR=[];txtAR[1]=initText("txt1");txtAR[1].boxes=[[25,57,460,50],[25,107,460,46]];txtAR[2]=initText("txt2");txtAR[2].boxes=[[25,57,460,50],[25,107,460,46]];txtAR[3]=initText("txt3");txtAR[3].boxes=[[25,57,460,50],[25,107,460,46]];}
function initText(txtName){var img=new Image();img.src="img_"+txtName+".png";var txtOb={id:"#"+txtName,img,};var el=gEL(txtOb.id);el.innerHTML="";el.style.backgroundImage="none";return txtOb;}
function revealText(txtOb,doAnimate=true){var el=gEL(txtOb.id);el.innerHTML="";el.classList="adsize";var renderCanvas=document.createElement("canvas");renderCanvas.setAttribute("class","adsize");renderCanvas.width=canvasWidth;renderCanvas.height=canvasHeight;var renderContext=renderCanvas.getContext("2d");el.appendChild(renderCanvas);txtOb.canvas=renderCanvas;txtOb.context=renderContext;txtOb.renderAR=[];var delay=0;for(var a in txtOb.boxes){var imgOb={};imgOb.srcRect=txtOb.boxes[a];for(var a in imgOb.srcRect){imgOb.srcRect[a]=imgOb.srcRect[a]*scale;}
if(doAnimate){imgOb.y=imgOb.srcRect[1]+imgOb.srcRect[3];TweenLite.to(imgOb,0.3,{y:imgOb.srcRect[1],ease:Power1.easeOut,delay});delay+=0.05;}else{imgOb.y=imgOb.srcRect[1];}
txtOb.renderAR.push(imgOb);}
onRenderRevealText(txtOb);if(doAnimate){TweenLite.to(this,1+delay,{onUpdate:onRenderRevealText,onUpdateParams:[txtOb]});}}
function onRenderRevealText(txtOb){txtOb.context.clearRect(0,0,canvasWidth,canvasHeight);for(var a in txtOb.renderAR){var imgOb=txtOb.renderAR[a];txtOb.context.save();txtOb.context.beginPath();txtOb.context.rect(imgOb.srcRect[0],imgOb.srcRect[1],imgOb.srcRect[2],imgOb.srcRect[3]);txtOb.context.clip();txtOb.context.drawImage(txtOb.img,imgOb.srcRect[0],imgOb.srcRect[1],imgOb.srcRect[2],imgOb.srcRect[3],imgOb.srcRect[0],imgOb.y,imgOb.srcRect[2],imgOb.srcRect[3]);txtOb.context.restore();}}
function hideText(txtOb){var delay=0;for(var a in txtOb.renderAR){var imgOb=txtOb.renderAR[a];TweenLite.to(imgOb,0.4,{y:imgOb.srcRect[1]-imgOb.srcRect[3],ease:Power3.easeOut,delay});}
TweenLite.to(this,0.4+delay,{onUpdate:onRenderRevealText,onUpdateParams:[txtOb],onComplete:rEL,onCompleteParams:[txtOb.canvas]});}
function gEL(id){return document.querySelector(id);}
function rEL(el){el.parentElement.removeChild(el);}
function bindEvent(el,eventName,eventHandler){if(el.addEventListener){el.addEventListener(eventName,eventHandler,false);}else if(el.attachEvent){el.attachEvent("on"+eventName,eventHandler);}}</script>
