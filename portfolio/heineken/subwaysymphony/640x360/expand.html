<script>var ab;var videoAR=["prologue","episode1","episode2","episode3"];var currentVideoID;var secondaryVideoControl;var adPlayBtnEL;function onExpandLoaded(){initThumbs();initMouseEvents();initSecondaryVideo();resetHeader();parent.expandLoaded()}function showViewExpand(a,b){ab=a;adPlayBtnEL=b;gEL("#ad-container").style.visibility="visible";gEL("#ad-container").className="adsize fadein trans500";setTimeout(expandShowDone,500)}function expandShowDone(){parent.expandShowDone();showHeader();playVideo("prologue")}function hideExpand(){gEL("#ad-container").className="adsize fadeout trans500";secondaryVideoControl.pause();adPlayBtnEL.style.visibility="hidden";setTimeout(hideExpandDone,500)}function hideExpandDone(){parent.closeExpand()}function resetHeader(){gEL("#header_white").className="header header_white_off";gEL("#header_logo").className="header fadeout";gEL("#header_title").className="header fadeout";gEL("#header_title_o").className="header fadeout";gEL("#header_name").className="header fadeout"}function showHeader(){var a=500;setTimeout(function(){gEL("#header_white").className="header header_white_on trans500out"},a);a+=500;setTimeout(function(){gEL("#header_logo").className="header fadein trans500"},a);a+=500;setTimeout(function(){gEL("#header_title").className="header fadein trans500";gEL("#header_title_o").className="header fadein trans500"},a);a+=500;setTimeout(function(){gEL("#header_title_o").className="header header_title_o_on trans1000"},a);a+=1000;setTimeout(function(){gEL("#header_name").className="header fadein trans500"},a)}function initThumbs(){var b;for(var c in videoAR){b=videoAR[c];gEL("#thumb_"+b).className="thumb thumb_off";gEL("#thumb_"+b).addEventListener("mouseover",onThumbOver);gEL("#thumb_"+b).addEventListener("mouseout",onThumbOut);gEL("#thumb_"+b).addEventListener("click",onThumbClick);gEL("#watch_"+b).className="watch fadeout"}}function selectThumb(a){gEL("#thumb_"+a).className="thumb thumb_on trans250";gEL("#thumb_"+a+"_tint").classNam
