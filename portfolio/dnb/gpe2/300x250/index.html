<!DOCTYPE html>
<html lang="en">
   <head>
      <title>300x250</title>
      <meta name="ad.size" content="width=300,height=250" />
      <meta name="format-detection" content="telephone=no" />
      <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1" />
      <meta http-equiv="X-UA-Compatible" content="IE=10" />
      <meta charset="UTF-8" />

      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/EasePack.min.js"></script>
<script>gsap.defaults({overwrite:"auto"});</script>



      <script>
         var clickTag = "https://www.dnb.com";

         window.onload = function() {
            //console.log("window.onload()");

            initMouseEvents();

            resetBanner();
            resetReveal();

            adVisible();
         };

         function adVisible() {
            //console.log("adVisible()");

            TweenLite.to("#banner", 0.25, { autoAlpha: 1 });

            startAnimation();
         }

         //------------------------------------------
         //      Mouse Events
         //------------------------------------------

         function initMouseEvents() {
            //console.log("initMouseEvents()");

            gEL("#banner").addEventListener("click", onBannerClick);
         }

         function onBannerClick(e) {
            //console.log("onBannerClick(e)");

            window.open(clickTag);
         }

         //------------------------------------------
         //      Animation
         //------------------------------------------

         var bannerWidth;
         var bannerHeight;

         var canvasScale = 2;
         var canvasWidth;
         var canvasHeight;

         function resetBanner() {
            //console.log("resetBanner()");

            bannerWidth = gEL("#banner").offsetWidth;
            bannerHeight = gEL("#banner").offsetHeight;

            TweenLite.set("#end_logo", { autoAlpha: 0 });

            TweenLite.set("#device1", { x: 0, y: 125 });
            TweenLite.set("#device2", { x: 170, y: 0 });

            TweenLite.set("#cta1", { y: 52 });
            TweenLite.set("#cta1_txt", { y: "100%" });

            TweenLite.set("#end_cta", { x: -146 });
            TweenLite.set("#end_cta_txt", { y: "100%" });
         }

         function startAnimation() {
            //console.log("startAnimation()");

            particlesInit();

            /* FRANE 1 */

            var delay = 1;
            TweenLite.delayedCall(delay, function() {
               revealText(txtAR[1]);
            });

            delay += 0.5;
            TweenLite.to("#cta1", 0.5, { y: 0, delay: delay, ease: Quad.easeOut });

            delay += 0.3;
            TweenLite.to("#cta1_txt", 0.5, { y: "0%", delay: delay, ease: Quad.easeOut });

            delay += 2;
            TweenLite.delayedCall(delay, function() {
               hideText(txtAR[1]);
            });

            delay += 0.5;
            TweenLite.delayedCall(delay, function() {
               revealText(txtAR[2]);
            });

            delay += 3.5;
            TweenLite.to("#cta1", 0.5, { y: 52, delay: delay, ease: Quad.easeIn });
            TweenLite.delayedCall(delay, function() {
               hideText(txtAR[2]);
            });

            TweenLite.to(this, 2, { particleSqueeze: 0.25, delay: delay, ease: Quad.easeInOut });

            delay += 1;
            TweenLite.to("#device1", 1, { x: 0, y: 0, delay: delay, ease: Quad.easeOut });
            TweenLite.to(this, 1, { particleMaxY: 600, delay: delay, ease: Quad.easeOut });

            /* END FRAME */

            delay += 1.5;
            TweenLite.to("#logo1", 0.5, { autoAlpha: 0, delay: delay });
            TweenLite.to("#canvas", 1, { x: 70, y: 0, delay: delay, ease: Quad.easeInOut });
            TweenLite.to("#device1", 1, { x: 70, y: 0, delay: delay, ease: Quad.easeInOut });
            TweenLite.to("#device2", 1, { x: 0, y: 0, delay: delay, ease: Quad.easeOut });

            delay += 0.5;
            TweenLite.to("#end_logo", 0.5, { autoAlpha: 1, delay: delay });

            delay += 0.5;
            TweenLite.delayedCall(delay, function() {
               revealText(txtAR[3]);
            });

            delay += 0.5;
            TweenLite.to("#end_cta", 0.5, { x: 0, delay: delay, ease: Quad.easeOut });

            delay += 0.3;
            TweenLite.to("#end_cta_txt", 0.5, { y: "0%", delay: delay, ease: Quad.easeOut });

            delay += 1;
            TweenLite.delayedCall(delay, function() {
               endParticles();
            });

            //console.log("TOTAL BANNER ANIMATION SECONDS: " + delay);
         }

         //------------------------------------------
         //      Particles
         //------------------------------------------

         var particlesCanvas;
         var particlesContext;

         var particlesCanvasWidth;
         var particlesCanvasHeight;

         var particleWidth = 25;
         var particleHeight = 55;
         var particleSpace = 1;

         var particlesRenderAr;
         var particleInterval;

         var focalLength = 1000;
         var rotationAxis = pt3d(0.9, 0, 0);
         var centerPt = pt3d(0, 0);

         var particleCols = 15;
         var particleRows = 50;

         var primaryColor = "52,108,128";
         var colorAr = ["33,128,154", "26,90,106"];

         var particleSqueeze = 1.6;
         var particleMaxY = 900;

         var particleEnd = false;

         function particlesInit() {
            //console.log("particlesInit()");

            centerPt.x = bannerWidth / 2;

            particlesCanvas = document.getElementById("canvas");
            particlesContext = particlesCanvas.getContext("2d");

            particlesRenderAr = [];

            onParticlesResize();
            window.addEventListener("resize", onParticlesResize);

            for (var b = -1; b < particleRows; b++) {
               buildRow(b);
            }

            onRenderParticles();
            resumeParticles();
         }

         function onParticlesResize() {
            //console.log("onParticlesResize()");

            particlesCanvasWidth = particlesCanvas.offsetWidth;
            particlesCanvasHeight = particlesCanvas.offsetHeight;

            var scale = 1;
            if (window.devicePixelRatio > 1) {
               scale = 2;
            }

            particlesCanvas.width = particlesCanvasWidth * scale;
            particlesCanvas.height = particlesCanvasHeight * scale;
            particlesContext.scale(scale, scale);
         }

         function buildRow(rowNum) {
            //console.log("buildRow(" + rowNum + ")");

            var offsetY = amtMoved - particleHeight;

            var startX = -(particleCols * particleWidth) / 2;
            var startY = offsetY + rowNum * particleHeight;

            if (rowNum >= 0) {
               startY += rowNum * 5;
            }
            //console.log(amtMoved, offsetY, startY);

            var partOb, distFromCenter, randColor;

            for (var a = 0; a < particleCols; a++) {
               partOb = {};

               partOb.x = startX + a * particleWidth;
               partOb.y = startY;

               distFromCenter = Math.round(Math.abs(partOb.x / (startX * 0.75)) * 100);
               //console.log(distFromCenter);
               if (randRange(1, Math.abs(startX * 0.9)) < distFromCenter) {
                  continue;
               }

               randColor = randRange(1, 100);
               if (randColor < 40) {
                  partOb.color = colorAr[randRange(0, colorAr.length - 1)];
               } else {
                  partOb.color = primaryColor;
               }

               partOb.pts = [];
               partOb.pts.push(pt3d(partOb.x, 0, 0));
               partOb.pts.push(pt3d(partOb.x + particleWidth - particleSpace, 0, 0));
               partOb.pts.push(pt3d(partOb.x + particleWidth - particleSpace, 0 + particleHeight - particleSpace, 0));
               partOb.pts.push(pt3d(partOb.x, 0 + particleHeight - particleSpace, 0));

               particlesRenderAr.push(partOb);
            }
         }

         function resumeParticles() {
            //console.log("resumeParticles()");

            TweenLite.delayedCall(0.03, redrawParticles);
         }

         function endParticles() {
            //console.log("endParticles()");

            particleEnd = true;
         }

         function stopParticles() {
            //console.log("stopParticles()");

            gsap.killTweensOf(redrawParticles);
         }

         function redrawParticles() {
            //console.log("redrawParticles()");

            onUpdateParticles();
            onRenderParticles();

            TweenLite.delayedCall(0.03, redrawParticles);
         }

         var moveAmt = 10;
         var amtMoved = particleHeight;

         function onUpdateParticles() {
            //console.log("onUpdateParticles()");

            if (amtMoved >= particleHeight) {
               buildRow(-1);
               amtMoved = 0;
            }

            var partOb;

            var a = particlesRenderAr.length;
            while (a--) {
               partOb = particlesRenderAr[a];

               partOb.y += moveAmt;

               if (partOb.y > particleMaxY) {
                  particlesRenderAr.splice(a, 1);
               }
            }

            amtMoved += moveAmt;

            if (particleEnd === true) {
               moveAmt *= 0.92;
               if (moveAmt < 0.5) {
                  stopParticles();
               }
            }

            //console.log(amtMoved);
         }

         function onRenderParticles() {
            //console.log("onRenderParticles()");

            particlesContext.clearRect(0, 0, particlesCanvasWidth, particlesCanvasHeight);

            var partOb, renderPts, pt1, pt2;

            for (var a in particlesRenderAr) {
               partOb = particlesRenderAr[a];
               renderPts = pt3dTopt2d(partOb.pts, rotationAxis, partOb.y);

               particlesContext.beginPath();

               for (var b in renderPts) {
                  pt1 = renderPts[b].x + centerPt.x;
                  pt2 = renderPts[b].y + centerPt.y;
                  //console.log(renderPts[b], pt1, pt2);

                  if (b === 0) {
                     particlesContext.moveTo(pt1, pt2);
                  } else {
                     particlesContext.lineTo(pt1, pt2);
                  }
               }

               particlesContext.fillStyle = "rgb(" + partOb.color + ",.5)";
               particlesContext.fill();

               //particlesContext.fillRect(partOb.x, partOb.y, particleWidth - 2, particleHeight - 2);

               //console.log("x:", partOb.x, "y:", partOb.y, "w:", particleWidth, "h:", particleHeight);
            }
         }

         function pt3d(x, y, z) {
            return { x: x, y: y, z: z };
         }

         function pt2d(x, y, depth, scaleFactor) {
            return { x: x, y: y, depth: depth, scaleFactor: scaleFactor };
         }

         function pt3dTopt2d(pts, axisRotations, partY) {
            var transformedPts = [];
            var sx = Math.sin(axisRotations.x);
            var cx = Math.cos(axisRotations.x);
            var sy = Math.sin(axisRotations.y);
            var cy = Math.cos(axisRotations.y);
            var sz = Math.sin(axisRotations.z);
            var cz = Math.cos(axisRotations.z);

            var x, y, z, xy, xz, yx, yz, zx, zy, scaleFactor;

            var i = pts.length;
            while (i--) {
               x = pts[i].x;
               y = pts[i].y + partY;
               z = pts[i].z;
               xy = cx * y - sx * z;
               xz = sx * y + cx * z;
               yz = cy * xz - sy * x;
               yx = sy * xz + cy * x;
               zx = cz * yx - sz * xy;
               zy = sz * yx + cz * xy;
               scaleFactor = focalLength / (focalLength + yz);
               x = zx * scaleFactor * (scaleFactor * particleSqueeze);
               y = (zy * scaleFactor) / (scaleFactor * 2.2);
               z = yz;
               transformedPts[i] = pt2d(x, y, -z, scaleFactor);
            }

            return transformedPts;
         }

         //------------------------------------------
         //      Text Effect
         //------------------------------------------

         var txtAR;

         function resetReveal() {
            //console.log("resetReveal()");

            canvasWidth = bannerWidth * canvasScale;
            canvasHeight = bannerHeight * canvasScale;

            // [ x, y, w, h ]

            txtAR = [];

            txtAR[1] = initText("txt1");
            txtAR[1].boxes = [
               [10, 100, 280, 22],
               [10, 128, 280, 22],
            ];

            txtAR[2] = initText("txt2");
            txtAR[2].boxes = [
               [10, 100, 280, 22],
               [10, 128, 280, 22],
            ];

            txtAR[3] = initText("end_txt");
            txtAR[3].boxes = [
               [22, 30, 250, 25],
               [22, 58, 250, 25],
            ];
         }

         function initText(txtName) {
            //console.log("initText(" + txtName + ")");

            var img = new Image();
            img.src = "img_" + txtName + ".png";

            var txtOb = {
               id: "#" + txtName,
               img: img,
               //showShadow: true,
            };

            var el = gEL(txtOb.id);
            el.innerHTML = "";
            el.style.backgroundImage = "none";

            return txtOb;
         }

         function revealText(txtOb, doAnimate = true) {
            //console.log("revealText()", txtOb);

            var el = gEL(txtOb.id);
            el.innerHTML = "";
            el.classList = "adsize";

            var renderCanvas = document.createElement("canvas");
            renderCanvas.setAttribute("class", "adsize");
            renderCanvas.width = canvasWidth;
            renderCanvas.height = canvasHeight;
            var renderContext = renderCanvas.getContext("2d");

            el.appendChild(renderCanvas);

            txtOb.canvas = renderCanvas;
            txtOb.context = renderContext;

            txtOb.renderAR = [];

            var delay = 0;
            for (var a in txtOb.boxes) {
               var partOb = {};
               partOb.srcRect = txtOb.boxes[a];

               for (var a in partOb.srcRect) {
                  partOb.srcRect[a] = partOb.srcRect[a] * canvasScale;
               }
               //console.log(partOb.srcRect);

               if (doAnimate) {
                  partOb.y = partOb.srcRect[1] + partOb.srcRect[3];
                  partOb.a = 0;
                  partOb.b = 10;
                  //console.log(partOb.srcRect[4]);

                  TweenLite.to(partOb, 0.5, { a: 1, b: 0, y: partOb.srcRect[1], ease: Power1.easeOut, delay });

                  delay += 0.25;
               } else {
                  partOb.y = partOb.srcRect[1];
                  partOb.a = 1;
               }

               txtOb.renderAR.push(partOb);
            }

            onRenderRevealText(txtOb);

            if (doAnimate) {
               TweenLite.to(this, 1 + delay, { onUpdate: onRenderRevealText, onUpdateParams: [txtOb] });
            }
         }

         function onRenderRevealText(txtOb) {
            //console.log("onRenderRevealText(txtOb)");

            txtOb.context.clearRect(0, 0, canvasWidth, canvasHeight);

            for (var a in txtOb.renderAR) {
               var partOb = txtOb.renderAR[a];

               txtOb.context.save();

               txtOb.context.globalAlpha = partOb.a;
               //console.log(partOb.a);

               txtOb.context.drawImage(txtOb.img, partOb.srcRect[0], partOb.srcRect[1], partOb.srcRect[2], partOb.srcRect[3], partOb.srcRect[0], partOb.y, partOb.srcRect[2], partOb.srcRect[3]);

               txtOb.context.restore();
            }
         }

         function hideText(txtOb) {
            //console.log("hideText()", txtOb);

            var delay = 0;
            for (var a in txtOb.renderAR) {
               var partOb = txtOb.renderAR[a];

               TweenLite.to(partOb, 0.3, { a: 0, y: partOb.srcRect[1] - partOb.srcRect[3], ease: Power1.easeIn, delay });
            }

            TweenLite.to(this, 0.3 + delay, { onUpdate: onRenderRevealText, onUpdateParams: [txtOb], onComplete: rEL, onCompleteParams: [txtOb.canvas] });
         }

         //------------------------------------------
         //      Helpers
         //------------------------------------------

         function gEL(id) {
            return document.querySelector(id);
         }

         function rEL(el) {
            //console.log("rEL(" + id + ")");
            el.parentElement.removeChild(el);
         }

         function randRange(min, max) {
            return Math.floor(window.Math.seedRandom() * (max - min + 1)) + min;
         }

         window.Math.seed = 13;
         window.Math.seedRandom = function(max, min) {
            max = max || 1;
            min = min || 0;
            Math.seed = (Math.seed * 9301 + 49297) % 233280;
            var rnd = Math.seed / 233280;
            return min + rnd * (max - min);
         };
      </script>
      <style>
         html,
         body {
            width: 100%;
            height: 100%;
            margin: 0px;
            padding: 0px;
            background-color: #fff;
            text-decoration: none !important;
         }

         div,
         canvas {
            position: absolute;
            transform: translatez(0);
            backface-visibility: hidden;
            background-position: 0px 0px;
            background-size: cover;
            background-repeat: no-repeat;
            pointer-events: none;
            user-select: none;
            transform-origin: 0%;
         }

         a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
         }

         #banner {
            background-color: #004f71;
            overflow: hidden;
            visibility: hidden;
            pointer-events: all;
            cursor: pointer;
         }

         #border {
            box-sizing: border-box;
            border: 1px solid #000;
         }

         .adsize {
            width: 300px;
            height: 250px;
            left: 0px;
            top: 0px;
            transform-origin: 50% 50%;
         }

         /* BOXES */

         #frame {
            box-sizing: border-box;
            border: 5px solid #4298b5;
         }

         /* ELEMENTS */

         #logo1 {
            background-image: url("img_logo1.png");
         }

         #txt1 {
            background-image: url("img_txt1.png");
         }

         #txt2 {
            background-image: url("img_txt2.png");
         }

         #end_txt {
            background-image: url("img_end_txt.png");
         }

         #end_logo {
            background-image: url("img_end_logo.png");
         }

         #device1 {
            background-image: url("img_device1.png");
         }

         #device2 {
            background-image: url("img_device2.png");
         }

         /* CTA 1 */

         .cta {
            width: 118px;
            height: 24px;
            left: 0px;
            top: 0px;
            border-radius: 50px;
            background-color: #74aa50;
            overflow: hidden;
            background-position-y: 0px;
            pointer-events: all;
            cursor: pointer;
         }

         .cta:hover {
            background-color: #4298b5;
         }

         .cta_txt {
            background-image: url("img_cta1.png");
         }

         #cta1 {
            left: 91px;
            top: 203px;
         }

         #end_cta {
            left: 24px;
            top: 108px;
         }
      </style>
   </head>

   <body>
      <div id="banner" class="adsize">
         <div id="device2" class="adsize"></div>
         <canvas id="canvas" class="adsize"></canvas>
         <div id="device1" class="adsize"></div>

         <div id="logo1" class="adsize"></div>

         <div id="txt1" class="adsize txt"></div>
         <div id="txt2" class="adsize txt"></div>

         <div id="cta1" class="cta"><div id="cta1_txt" class="cta cta_txt"></div></div>

         <div id="end_txt" class="adsize txt"></div>
         <div id="end_logo" class="adsize"></div>

         <div id="end_cta" class="cta"><div id="end_cta_txt" class="cta cta_txt"></div></div>

         <div id="frame" class="adsize"></div>
      </div>

      <div id="border" class="adsize"></div>
   </body>
</html>
