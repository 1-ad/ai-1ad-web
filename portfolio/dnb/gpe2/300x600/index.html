<!DOCTYPE html>

<script>gsap.defaults({overwrite:"auto"});</script>


<script>var clickTag="https://www.dnb.com";window.onload=function(){initMouseEvents();resetBanner();resetReveal();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1});startAnimation();}
function initMouseEvents(){gEL("#banner").addEventListener("click",onBannerClick);}
function onBannerClick(e){window.open(clickTag);}
var bannerWidth;var bannerHeight;var canvasScale=2;var canvasWidth;var canvasHeight;function resetBanner(){bannerWidth=gEL("#banner").offsetWidth;bannerHeight=gEL("#banner").offsetHeight;TweenLite.set("#device1",{x:0,y:240});TweenLite.set("#cta1",{y:40,autoAlpha:0});TweenLite.set("#cta1_txt",{y:"100%"});}
function startAnimation(){particlesInit();var delay=1;TweenLite.delayedCall(delay,function(){revealText(txtAR[1]);});delay+=0.5;TweenLite.to("#cta1",0.5,{y:0,autoAlpha:1,delay:delay,ease:Quad.easeOut});delay+=0.3;TweenLite.to("#cta1_txt",0.5,{y:"0%",delay:delay,ease:Quad.easeOut});delay+=2;TweenLite.delayedCall(delay,function(){hideText(txtAR[1]);});delay+=0.5;TweenLite.delayedCall(delay,function(){revealText(txtAR[2]);});delay+=3.5;TweenLite.delayedCall(delay,function(){hideText(txtAR[2]);});delay+=0.5;TweenLite.to("#cta1",1.5,{y:-130,delay:delay,ease:Quad.easeInOut});TweenLite.to("#device1",1.5,{x:0,y:0,delay:delay,ease:Quad.easeInOut});TweenLite.to(this,1.5,{particleSqueeze:0.5,delay:delay,ease:Quad.easeInOut});TweenLite.to(rotationAxis,1.5,{x:1,delay:delay,ease:Quad.easeInOut});delay+=1.5;TweenLite.delayedCall(delay,function(){revealText(txtAR[3]);});delay+=1;TweenLite.delayedCall(delay,function(){endParticles();});}
var particlesCanvas;var particlesContext;var particlesCanvasWidth;var particlesCanvasHeight;var particleWidth=35;var particleHeight=95;var particleSpace=1;var particlesRenderAr;var particleInterval;var focalLength=1500;var rotationAxis=pt3d(0.7,0,0);var centerPt=pt3d(0,0);var particleCols=15;var particleRows=18;var primaryColor="52,108,128";var colorAr=["33,128,154","26,90,106"];var particleSqueeze=1.6;var particleMaxY=1700;var particleEnd=false;function particlesInit(){centerPt.x=bannerWidth/2;particlesCanvas=document.getElementById("canvas");particlesContext=particlesCanvas.getContext("2d");particlesRenderAr=[];onParticlesResize();window.addEventListener("resize",onParticlesResize);for(var b=-1;b<particleRows;b++){buildRow(b);}
onRenderParticles();resumeParticles();}
function onParticlesResize(){particlesCanvasWidth=particlesCanvas.offsetWidth;particlesCanvasHeight=particlesCanvas.offsetHeight;var scale=1;if(window.devicePixelRatio>1){scale=2;}
particlesCanvas.width=particlesCanvasWidth*scale;particlesCanvas.height=particlesCanvasHeight*scale;particlesContext.scale(scale,scale);}
function buildRow(rowNum){var offsetY=amtMoved-particleHeight;var startX=-(particleCols*particleWidth)/2;var startY=offsetY+rowNum*particleHeight;startY+=rowNum*5;var partOb,distFromCenter,randColor;for(var a=0;a<particleCols;a++){partOb={};partOb.x=startX+a*particleWidth;partOb.y=startY;distFromCenter=Math.round(Math.abs(partOb.x/(startX*0.75))*100);if(randRange(1,Math.abs(startX*0.9))<distFromCenter){continue;}
randColor=randRange(1,100);if(randColor<40){partOb.color=colorAr[randRange(0,colorAr.length-1)];}else{partOb.color=primaryColor;}
partOb.pts=[];partOb.pts.push(pt3d(partOb.x,0,0));partOb.pts.push(pt3d(partOb.x+particleWidth-particleSpace,0,0));partOb.pts.push(pt3d(partOb.x+particleWidth-particleSpace,0+particleHeight-particleSpace,0));partOb.pts.push(pt3d(partOb.x,0+particleHeight-particleSpace,0));particlesRenderAr.push(partOb);}}
function resumeParticles(){TweenLite.delayedCall(0.03,redrawParticles);}
function endParticles(){particleEnd=true;}
function stopParticles(){gsap.killTweensOf(redrawParticles);}
function redrawParticles(){onUpdateParticles();onRenderParticles();TweenLite.delayedCall(0.03,redrawParticles);}
var moveAmt=10;var amtMoved=particleHeight;function onUpdateParticles(){if(amtMoved>=particleHeight){buildRow(-1);amtMoved=0;}
var partOb;var a=particlesRenderAr.length;while(a--){partOb=particlesRenderAr[a];partOb.y+=moveAmt;if(partOb.y>particleMaxY){particlesRenderAr.splice(a,1);}}
amtMoved+=moveAmt;if(particleEnd===true){moveAmt*=0.92;if(moveAmt<0.5){stopParticles();}}}
function onRenderParticles(){particlesContext.clearRect(0,0,particlesCanvasWidth,particlesCanvasHeight);var partOb,renderPts,pt1,pt2;for(var a in particlesRenderAr){partOb=particlesRenderAr[a];renderPts=pt3dTopt2d(partOb.pts,rotationAxis,partOb.y);particlesContext.beginPath();for(var b in renderPts){pt1=renderPts[b].x+centerPt.x;pt2=renderPts[b].y+centerPt.y;if(b===0){particlesContext.moveTo(pt1,pt2);}else{particlesContext.lineTo(pt1,pt2);}}
particlesContext.fillStyle="rgb("+partOb.color+",.5)";particlesContext.fill();}}
function pt3d(x,y,z){return{x:x,y:y,z:z};}
function pt2d(x,y,depth,scaleFactor){return{x:x,y:y,depth:depth,scaleFactor:scaleFactor};}
function pt3dTopt2d(pts,axisRotations,partY){var transformedPts=[];var sx=Math.sin(axisRotations.x);var cx=Math.cos(axisRotations.x);var sy=Math.sin(axisRotations.y);var cy=Math.cos(axisRotations.y);var sz=Math.sin(axisRotations.z);var cz=Math.cos(axisRotations.z);var x,y,z,xy,xz,yx,yz,zx,zy,scaleFactor;var i=pts.length;while(i--){x=pts[i].x;y=pts[i].y+partY;z=pts[i].z;xy=cx*y-sx*z;xz=sx*y+cx*z;yz=cy*xz-sy*x;yx=sy*xz+cy*x;zx=cz*yx-sz*xy;zy=sz*yx+cz*xy;scaleFactor=focalLength/(focalLength+yz);x=zx*scaleFactor*(scaleFactor*particleSqueeze);y=(zy*scaleFactor)/(scaleFactor*2.2);z=yz;transformedPts[i]=pt2d(x,y,-z,scaleFactor);}
return transformedPts;}
var txtAR;function resetReveal(){canvasWidth=bannerWidth*canvasScale;canvasHeight=bannerHeight*canvasScale;txtAR=[];txtAR[1]=initText("txt1");txtAR[1].boxes=[[49,261,200,21],[49,293,200,21],];txtAR[2]=initText("txt2");txtAR[2].boxes=[[49,232,200,21],[49,262,200,21],[49,294,200,21],];txtAR[3]=initText("end_txt");txtAR[3].boxes=[[25,118,250,21],[49,149,200,21],];}
function initText(txtName){var img=new Image();img.src="img_"+txtName+".png";var txtOb={id:"#"+txtName,img:img,};var el=gEL(txtOb.id);el.innerHTML="";el.style.backgroundImage="none";return txtOb;}
function revealText(txtOb,doAnimate=true){var el=gEL(txtOb.id);el.innerHTML="";el.classList="adsize";var renderCanvas=document.createElement("canvas");renderCanvas.setAttribute("class","adsize");renderCanvas.width=canvasWidth;renderCanvas.height=canvasHeight;var renderContext=renderCanvas.getContext("2d");el.appendChild(renderCanvas);txtOb.canvas=renderCanvas;txtOb.context=renderContext;txtOb.renderAR=[];var delay=0;for(var a in txtOb.boxes){var partOb={};partOb.srcRect=txtOb.boxes[a];for(var a in partOb.srcRect){partOb.srcRect[a]=partOb.srcRect[a]*canvasScale;}
if(doAnimate){partOb.y=partOb.srcRect[1]+partOb.srcRect[3];partOb.a=0;partOb.b=10;TweenLite.to(partOb,0.5,{a:1,b:0,y:partOb.srcRect[1],ease:Power1.easeOut,delay});delay+=0.25;}else{partOb.y=partOb.srcRect[1];partOb.a=1;}
txtOb.renderAR.push(partOb);}
onRenderRevealText(txtOb);if(doAnimate){TweenLite.to(this,1+delay,{onUpdate:onRenderRevealText,onUpdateParams:[txtOb]});}}
function onRenderRevealText(txtOb){txtOb.context.clearRect(0,0,canvasWidth,canvasHeight);for(var a in txtOb.renderAR){var partOb=txtOb.renderAR[a];txtOb.context.save();txtOb.context.globalAlpha=partOb.a;txtOb.context.drawImage(txtOb.img,partOb.srcRect[0],partOb.srcRect[1],partOb.srcRect[2],partOb.srcRect[3],partOb.srcRect[0],partOb.y,partOb.srcRect[2],partOb.srcRect[3]);txtOb.context.restore();}}
function hideText(txtOb){var delay=0;for(var a in txtOb.renderAR){var partOb=txtOb.renderAR[a];TweenLite.to(partOb,0.3,{a:0,y:partOb.srcRect[1]-partOb.srcRect[3],ease:Power1.easeIn,delay});}
TweenLite.to(this,0.3+delay,{onUpdate:onRenderRevealText,onUpdateParams:[txtOb],onComplete:rEL,onCompleteParams:[txtOb.canvas]});}
function gEL(id){return document.querySelector(id);}
function rEL(el){el.parentElement.removeChild(el);}
function randRange(min,max){return Math.floor(window.Math.seedRandom()*(max-min+1))+min;}
window.Math.seed=20;window.Math.seedRandom=function(max,min){max=max||1;min=min||0;Math.seed=(Math.seed*9301+49297)%233280;var rnd=Math.seed/233280;return min+rnd*(max-min);};</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,canvas{position:absolute;transform:translatez(0);backface-visibility:hidden;background-position:0 0;background-size:cover;background-repeat:no-repeat;pointer-events:none;user-select:none;transform-origin:0 0}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important}#banner{background-color:#004f71;overflow:hidden;visibility:hidden;pointer-events:all;cursor:pointer}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:300px;height:600px;left:0;top:0;transform-origin:50% 50%}#frame{box-sizing:border-box;border:5px solid #4298b5}#logo1{background-image:url("img_logo1.png")}#txt1{background-image:url("img_txt1.png")}#txt2{background-image:url("img_txt2.png")}#end_txt{background-image:url("img_end_txt.png")}#device1{background-image:url("img_device1.png")}.cta{width:118px;height:24px;left:0;top:0;border-radius:50px;background-color:#74aa50;overflow:hidden;background-position-y:0;pointer-events:all;cursor:pointer}.cta:hover{background-color:#4298b5}.cta_txt{background-image:url("img_cta1.png")}#cta1{left:91px;top:340px}</style>
