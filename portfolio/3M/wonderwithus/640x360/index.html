<style type=text/css>body{vertical-align:baseline;border:0 none;outline:0;padding:0;margin:0;left:0;top:0;width:100%;height:100%}div,img,svg{position:absolute;user-select:none;background-position:0 0;background-size:cover;background-repeat:no-repeat;transform-origin:0 0;backface-visibility:hidden;pointer-events:none;overflow:hidden}#ad-container{overflow:hidden;visibility:hidden;background-color:#000}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:640px;height:360px;left:0;top:0}.video{width:100%;height:100%;pointer-events:auto;cursor:pointer}.video-container{background-color:#000}.video-container_slate{width:336px;height:189px;left:284px;top:20px}.video-playbutton{left:0;top:0;width:640px;height:360px;background-color:rgba(0,0,0,.5);visibility:hidden;pointer-events:auto;cursor:pointer}.loader{width:40px;height:40px;left:50%;top:50%;margin-left:-28px;margin-top:-28px;transform-origin:50% 50%;border:8px solid rgba(204,204,204,0.75);border-top:8px solid #fff;border-radius:50%;animation:loader_spin 2s linear infinite;pointer-events:none}@keyframes loader_spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}#bkgrnd{background-image:url("img_bkgrnd.png");pointer-events:auto;cursor:pointer}.thumb{width:144px;height:81px;top:217px;pointer-events:auto;cursor:pointer}.thumb_selected{outline:1px solid white}.thumb_tint{width:100%;height:100%;left:0;top:0;background-color:rgba(0,0,0,.2)}.thumb_play{width:144px;height:81px;left:0;top:0;background-image:url("img_thumb_play.png")}#thumb_Commute{left:20px;background-image:url("img_thumb_Commute.png")}#thumb_Home{left:172px;background-image:url("img_thumb_Home.png")}#thumb_Mountain{left:324px;background-image:url("img_thumb_Mountain.png")}#thumb_Skate{left:476px;background-image:url("img_thumb_Skate.png")}#cta{width:148px;height:20px;left:19px;top:156px}#cta_img{width:148px;height:20px;left:0;top:0;background-image:url("img_cta.png");background-position:0 0;pointer-events:auto;cursor:pointer}#cta_img:hove <script type=text/javascript>var ab;var showViewSeconds=2;var viewWasShown=false;var videoAR=["Commute","Home","Mountain","Skate"];var doneAR=[0,0,0,0];var currentVideoID=videoAR[0];var currentVideoNum=0;var primaryVideoID;var primaryVideoDone;var primaryVideoControl;var secondaryVideoControl;function onAdInit(){initVideo();initThumbs();initMouseEvents();initSecondaryVideo();onWindowResize();gEL("#ad-container").style.visibility="visible";ab.ready()}function initVideo(){primaryVideoID=videoAR[0];primaryVideoDone=false;var a=ab.getPrimaryVideoConfig();primaryVideoControl=ab.addVideo(a,gEL("#primary-video"),gEL("#ad-video-playbutton"),gEL("#primary-loader"));ab.addPrimaryVideoController(primaryVideoControl);primaryVideoControl.on("TimeUpdate",function(){onVideoTimeUpdate(primaryVideoControl)},false);gEL("#primary-video").addEventListener("ended",function(){primaryVideoDone=true;if(userEngaged!=true){ab.stopAd()}else{nextVideo()}});primaryVideoControl.play()}function onVideoTimeUpdate(b){var c=b.getCurrentTime();var a=b.getRemainingTime();if(c>=showViewSeconds&&!viewWasShown){viewWasShown=true;showView()}}function onAdVideoStart(){}function onAdVideoTimeUpdate(a,b){}function onAdVideoFirstQuartile(){}function onAdVideoMidpoint(){}function onAdVideoThirdQuartile(){}function onAdVideoComplete(){}function onAdVideoPlayComplete(){}function onAdVolumeChange(a){}function onAdPaused(){}function onAdPlaying(){}function onAdSizeChange(a,b,c){resizeCreative(a,b,c)}function onAdUserClose(){}function onAdStopped(){}function onAdExpandedChange(){}function onAdSkippableStateChange(){}function onAdSkipped(){}function onAdExtended(){}function onAdDurationChange(){}function onAdRemainingTimeChange(){}function showView(){gEL("#primary-video-container").className="video-container video-container_slate trans1000";var a=1000;setTimeout(function(){ab.track("slate/viewed")},a);setTimeout(showCloseBtn,15000)}function showCloseBtn(){if(userEngaged==true){gEL("#close").style.visibility="visible"}}function playVideo(a){if(currentVideoID){unSelectThumb(currentVideoID)}currentVideoID=a;currentVideoNum=videoAR.indexOf(currentVideoID);selectThumb(currentVideoID);primaryVideoControl.pause();if(secondaryVideoControl){secondaryVideoControl.pause()}gEL("#secondary-video").src=null;gEL("#secondary-video").removeAttribute("src");if(currentVideoID==primaryVideoID){resumePrimaryVideo()}else{playSecondaryVideo(currentVideoID)}gEL("#ad-video-playbutton").style.visibility="hidden"}function nextVideo(){doneAR[currentVideoNum]=1;var b=doneAR.length-1;if(currentVideoNum==b){currentVideoNum=-1}var g=currentVideoNum+1;var e,d;for(var c=g;c<=b;c++){e=doneAR[c];if(e==0){d=c;break}}if(d!=null){var f=videoAR[d];playVideo(f)}}function initSecondaryVideo(){gEL("#secondary-video-container").style.visibility="hidden";gEL("#secondary-loader").className="loader fadeout";gEL("#secondary-video").addEventListener("ended",function(){nextVideo()})}function resumePrimaryVideo(){gEL("#primary-video-container").style.visibility="visible";gEL("#secondary-video-container").style.visibility="hidden";gEL("#primary-video-container").style.display="block";gEL("#secondary-video-container").style.display="none";var a=ab.getPrimaryVideoConfig();primaryVideoControl=ab.addVideo(a,gEL("#primary-video"),gEL("#ad-video-playbutton"),gEL("#primary-loader"));if(primaryVideoDone==true){primaryVideoDone=false;gEL("#primary-video").currentTime=0}primaryVideoControl.play()}function playSecondaryVideo(b){gEL("#primary-video-container").style.visibility="hidden";gEL("#secondary-video-container").style.visibility="visible";gEL("#primary-video-container").style.display="none";gEL("#secondary-video-container").style.display="block";var a=ab.getVideoConfigByName(b);secondaryVideoControl=ab.addVideo(a,gEL("#secondary-video"),gEL("#ad-video-playbutton"),gEL("#secondary-loader"));secondaryVideoControl.play()}function initMouseEvents(){gEL("#close").addEventListener("click",onCloseClick);gEL("#bkgrnd").addEventListener("click",onBkgrndClick);gEL("#cta").addEventListener("click",onCTAClick)}function onCloseClick(){ab.track("slate/click/close");ab.stopAd()}function onBkgrndClick(){ab.openClickThru("slate/clickthru/bkgrnd")}function onCTAClick(){ab.openClickThru("slate/clickthru/ctabtn")}function initThumbs(){var b;for(var c in videoAR){b=videoAR[c];gEL("#thumb_"+b).className="thumb thumb_off";gEL("#thumb_"+b).addEventListener("mouseover",onThumbOver);gEL("#thumb_"+b).addEventListener("mouseout",onThumbOut);gEL("#thumb_"+b).addEventListener("click",onThumbClick)}selectThumb(primaryVideoID)}function selectThumb(a){gEL("#thumb_"+a).className="thumb thumb_selected";gEL("#thumb_"+a+"_tint").className="thumb_tint fadeout";gEL("#thumb_"+a+"_play").className="thumb_play fadeout"}function unSelectThumb(a){gEL("#thumb_"+a).className="thumb";gEL("#thumb_"+a+"_tint").className="thumb_tint fadein";gEL("#thumb_"+a+"_play").className="thumb_play fadein"}function onThumbOver(b){var a=b.target.id.split("_")[1];if(a!=currentVideoID){gEL("#thumb_"+a+"_tint").className="thumb_tint fadeout";gEL("#thumb_"+a+"_play").className="thumb_play fadeout"}}function onThumbOut(b){var a=b.target.id.split("_")[1];if(a!=currentVideoID){gEL("#thumb_"+a+"_tint").className="thumb_tint fadein";gEL("#thumb_"+a+"_play").className="thumb_play fadein"}}function onThumbClick(b){var a=b.target.id.split("_")[1];ab.track("slate/click/"+a);sendUserEngaged();playVideo(a)}document.body.onload=onWindowResize;window.addEventListener("resize",onWindowResize);function onWindowResize(){resizeCreative(window.innerWidth,window.innerHeight)}function resizeCreative(b,d,e){var g=640;var f=360;var b=window.innerWidth;var d=window.innerHeight;var a=Math.min(b/g,d/f);var c=Math.round((b-(g*a))/2);var h=Math.round((d-(f*a))/2);gEL("#ad-container").style.transform="scale("+a+", "+a+")";gEL("#ad-container").style.left=c+"px";gEL("#ad-container").style.top=h+"px"}var userEngaged=false;function sendUserEngaged(){userEngaged=true;if(userEngaged!=true){}}
