<script type=text/javascript>var videoDuration=15;var userEngaged;var showResume;var videoCompleted;var trackedQuartile;window.onload=function(){initVideo();initMouseEvents();if(Enabler.isInitialized()){adInit()}else{Enabler.addEventListener(studio.events.StudioEvent.INIT,adInit)}};function adInit(){if(!Enabler.isVisible()){Enabler.addEventListener(studio.events.StudioEvent.VISIBLE,adVisible)}else{adVisible()}}function adVisible(){startAnimation()}function initMouseEvents(){gEL("#bkgrnd").addEventListener("click",onBkgrndClick);gEL("#audio").addEventListener("click",onAudioClick);gEL("#replay").addEventListener("click",onReplaylick);gEL("#primary_player").addEventListener("click",onVideoClick)}function onBkgrndClick(a){clickThru("bkgrnd")}function onAudioClick(a){if(gEL("#primary_video").muted!=true){videoMute()}else{videoUnmute()}}function onReplaylick(a){userEngaged=true;videoStart()}function onVideoClick(a){if(userEngaged!==true){engageBanner()}else{if(gEL("#primary_video").paused===true){gEL("#primary_video").play()}else{clickThru("video")}}}function clickThru(a){gEL("#primary_video").pause();Enabler.exit("Banner")}function resetBanner(){gEL("#engage").className="engage_off";gEL("#audio").className="ctrl fadeout";gEL("#replay").className="ctrl fadeout";gEL("#primary_resume").className="resume fadeout"}function startAnimation(){clearAllRequestTimeouts();resetBanner();var a=0;requestTimeout(function(){gEL("#banner").className="adsize fadein trans500"},a);a+=500;requestTimeout(function(){gEL("#engage").className="engage_on trans500"},a);gEL("#primary_video").muted=true;gEL("#primary_video").currentTime=0;gEL("#primary_video").play()}function engageBanner(){userEngaged=true;showResume=false;gEL("#primary_video").pause();gEL("#primary_video").className="video fadeout";gEL("#primary_resume").className="resume fadeout";engageCancel();requestTimeout(videoStart,250)}function engageCancel(){gEL("#engage").className="engage_off trans500"}function videoMute(){gEL("#audio_mu se()}var timeoutAR=[];function requestTimeout(a,c){var b={};b.id=Math.random();b.callbackFN=a;b.delayMS=c;b.startMS=void 0;b.remainMS=c;b.timerTO=void 0;b.pause=function(){window.clearTimeout(b.timerTO);b.remainMS-=new Date()-b.startMS;if(b.remainMS<-1){b.clear()}};b.resume=function(){b.startMS=new Date();window.clearTimeout(b.timerTO);b.timerTO=window.setTimeout(b.callbackFN,b.remainMS)};b.clear=function(){window.clearTimeout(b.timerTO);var d=gIndex(timeoutAR,"id",b.id);if(d>-1){timeoutAR.splice(d,1)}};b.resume();timeoutAR.push(b);return b}function clearAllRequestTimeouts(){var b=timeoutAR.length;while(b--){timeoutAR[b].clear()}timeoutAR=[]}function pauseAllTimeouts(){var b=timeoutAR.length;while(b--){timeoutAR[b].pause()}}function resumeAllTimeouts(){var b=timeoutAR.length;while(b--){timeoutAR[b].resume()}}function gIndex(e,c,d){for(var b in e){if(e[b][c]===d){return b}}return -1}function gEL(a){return document.querySelector(a)}function getQuartile(a){return Math.floor(a/25)*25};</script>
