<style type=text/css>body{vertical-align:baseline;border:0 none;outline:0;padding:0;margin:0;left:0;top:0;width:100%;height:100%}div,img{position:absolute;pointer-events:none;user-select:none}#ad-container{overflow:hidden;visibility:hidden;background-color:#000}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:640px;height:360px;left:0;top:0}.video{width:100%;height:100%;pointer-events:auto;cursor:pointer}.video-container{background-color:#000}.video-container_slate{left:217px;top:119px;width:416px;height:234px}.video-playbutton{left:0;top:0;width:640px;height:360px;background-color:rgba(0,0,0,.5);visibility:hidden;pointer-events:auto;cursor:pointer}.loader{width:40px;height:40px;left:50%;top:50%;margin-left:-28px;margin-top:-28px;transform-origin:50% 50%;border:8px solid rgba(204,204,204,0.75);border-top:8px solid #fff;border-radius:50%;animation:loader_spin 2s linear infinite;pointer-events:none}@keyframes loader_spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}#bkgrnd-video{top:0;left:0;width:640px;height:360px}#overlay{top:0;left:0;width:640px;height:360px;pointer-events:all;cursor:auto}#shopnow{left:44px;top:282px;width:130px;height:32px}#shopnow_btn{top:0;left:0;width:130px;height:32px;background-image:url("img_shopnow.png");background-position:0 0;background-size:cover;pointer-events:auto;cursor:pointer}#shopnow_btn:hover{background-position:0 -32px}.fadein{opacity:1;visibility:visible}.fadeout{opacity:0;visibility:hidden}.trans500{-webkit-transition:all 500ms ease-in-out;-moz-transition:all 500ms ease-in-out;-o-transition:all 500ms ease-in-out;transition:all 500ms ease-in-out}.trans1000{-webkit-transition:all 1000ms ease-in-out;-moz-transition:all 1000ms ease-in-out;-o-transition:all 1000ms ease-in-out;transition:all 1000ms ease-in-out}</style>

<script type=text/javascript>var ab;var showViewSeconds=2;var viewWasShown=false;function onAdInit(){initVideo();initClickThrus();gEL("#ad-container").style.visibility="visible";ab.ready()}function initVideo(){var a=ab.getPrimaryVideoConfig();primaryVideoControl=ab.addVideo(a,gEL("#primary-video"),gEL("#primary-video-playbutton"),gEL("#primary-loader"));ab.addPrimaryVideoController(primaryVideoControl);primaryVideoControl.on("TimeUpdate",function(){onVideoTimeUpdate(primaryVideoControl)},false);gEL("#primary-video").addEventListener("ended",function(){ab.stopAd()});primaryVideoControl.play();gEL("#bkgrnd-video").pause();gEL("#bkgrnd-video").currentTime=0}function onVideoTimeUpdate(b){var c=b.getCurrentTime();var a=b.getRemainingTime();if(c>=showViewSeconds&&!viewWasShown){viewWasShown=true;showView()}}function onAdVideoStart(){}function onAdVideoTimeUpdate(a,b){}function onAdVideoFirstQuartile(){}function onAdVideoMidpoint(){}function onAdVideoThirdQuartile(){}function onAdVideoComplete(){}function onAdVideoPlayComplete(){}function onAdVolumeChange(a){}function onAdPaused(){}function onAdPlaying(){}function onAdSizeChange(a,b,c){resizeCreative(a,b,c)}function onAdUserClose(){}function onAdStopped(){}function onAdExpandedChange(){}function onAdSkippableStateChange(){}function onAdSkipped(){}function onAdExtended(){}function onAdDurationChange(){}function onAdRemainingTimeChange(){}function showView(){gEL("#primary-video-container").className="video-container video-container_slate trans1000";setTimeout(showViewDone,1000)}function showViewDone(){gEL("#bkgrnd-video").play()}function initClickThrus(){gEL("#overlay").addEventListener("click",onBkgrndClick);gEL("#shopnow").addEventListener("click",onShopNowClick)}function onBkgrndClick(a){ab.openClickThru("clickthru/bkgrnd")}function onShopNowClick(a){ab.openClickThru("clickthru/shopnow")}document.body.onload=onWindowResize;window.addEventListener("resize",onWindowResize);function onWindowResize(){resizeCreative(window.innerWidth,window.innerHeight)}function resizeCreative(b,d,e){var g=640;var f=360;var b=window.innerWidth;var d=window.innerHeight;var a=Math.min(b/g,d/f);var c=Math.round((b-(g*a))/2);var h=Math.round((d-(f*a))/2);gEL("#ad-container").style.transform="scale("+a+", "+a+")";gEL("#ad-container").style.left=c+"px";gEL("#ad-container").style.top=h+"px"}var userEngaged=false;function sendUserEngaged(){userEngaged=true;if(userEngaged!=true){}}function gEL(a){return document.querySelector(a)}</script>
<script type=text/javascript>window.addEventListener("load",function(){ab=adBridge;ab.on("AdInit",onAdInit);ab.on("AdVideoStart",onAdVideoStart);ab.on("AdVideoTimeUpdate",onAdVideoTimeUpdate);ab.on("AdVideoFirstQuartile",onAdVideoFirstQuartile);ab.on("AdVideoMidpoint",onAdVideoMidpoint);ab.on("AdVideoThirdQuartile",onAdVideoThirdQuartile);ab.on("AdVideoComplete",onAdVideoComplete);ab.on("AdVideoPlayComplete",onAdVideoPlayComplete);ab.on("AdVolumeChange",onAdVolumeChange);ab.on("AdPaused",onAdPaused);ab.on("AdPlaying",onAdPlaying);ab.on("AdSizeChange",onAdSizeChange);ab.on("AdUserClose",onAdUserClose);ab.on("AdStopped",onAdStopped);ab.on("AdExpandedChange",onAdExpandedChange);ab.on("AdSkippableStateChange",onAdSkippableStateChange);ab.on("AdSkipped",onAdSkipped);ab.on("AdExtended",onAdExtended);ab.on("AdDurationChange",onAdDurationChange);ab.on("AdRemainingTimeChange",onAdRemainingTimeChange);ab.pageLoaded()});</script>
