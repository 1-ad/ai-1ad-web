<!DOCTYPE html>
<html lang=en>
<head>
<title>300x250</title>
<meta name=ad.size content="width=300,height=250">
<meta name=format-detection content="telephone=no">
<meta charset=UTF-8>
<script src=common.js></script>
<script src=particle.js></script>
<script>var adMaxTime=6000;var canvasWidth=300;var canvasHeight=250;var clickTag="https://spark.adobe.com/page/MyGlffEb2ZH2u/";window.onload=function(){gEL("#banner").addEventListener("click",onBannerClick);var a={};a.renderCanvas="#effectCanvas";a.imageAR=["glass1.png","glass2.png"];a.onReady=onEffectReady;a.onComplete=onEffectComplete;a.sourceRect=rect(0,0,300,250);initParticle(a)};function onBannerClick(a){window.open(clickTag,"_blank")}function onEffectReady(){requestTimeout(bannerStart,250)}function onEffectComplete(){}function bannerStart(){var a=0;requestTimeout(function(){gEL("#banner").className="adsize fadein trans250"},a);a+=500;requestTimeout(function(){gEL("#text").className="adsize center trans500out"},a);a+=500;requestTimeout(function(){gEL("#cta").className="center trans500out"},a);a+=500;requestTimeout(function(){startFX()},a)};</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,img,canvas{position:absolute;transform:translatez(0);backface-visibility:hidden;background-position:0 0;background-size:cover;pointer-events:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important;-webkit-tap-highlight-color:rgba(0,0,0,0)!important;-webkit-touch-callout:none!important}#banner{background-color:#fff;overflow:hidden;pointer-events:all;cursor:pointer}.adsize{width:300px;height:250px;left:0;top:0}#bkgrnd{background-image:url("bkgrnd.jpg")}#text{background-image:url("text.png")}#cta{width:133px;height:35px;left:20px;top:108px}#cta_box{width:130px;height:32px;left:0;top:0;background-color:#fff;background-image:url("cta.png");background-position:0 0;pointer-events:all;cursor:pointer}#cta_box:hover{background-position:0 -32px}#cta_border{width:130px;height:32px;left:3px;top:3px;border:1px solid #fff;box-sizing:border-box}.cta_off{-ms-transform:translateX(280px);-webkit-transform:translateX(280px);transform:translateX(280px)}.fadein{opacity:1;visibility:visible}.fadeout{opacity:0;visibility:hidden}.trans250{-webkit-transition:all 250ms ease-in-out;-moz-transition:all 250ms ease-in-out;-o-transition:all 250ms ease-in-out;transition:all 250ms ease-in-out}.trans500out{-webkit-transition:all 500ms ease-out;-moz-transition:all 500ms ease-out;-o-transition:all 500ms ease-out;transition:all 500ms ease-out}.right{-ms-transform:translateX(100%);-webkit-transform:translateX(100%);transform:translateX(100%)}.center{-ms-transform:translate(0,0);-webkit-transform:translate(0,0);transform:translate(0,0)}</style>
</head>
<body>
<img src=glass1.png alt style=visibility:hidden />
<img src=glass2.png alt style=visibility:hidden />
<div id=banner class="adsize fadeout">
<div id=bkgrnd class=adsize></div>
<div id=text class="adsize right"></div>
<div id=cta class=cta_off>
<div id=cta_border></div>
<div id=cta_box></div>
</div>
<canvas id=effectCanvas class=adsize width=300 height=250></canvas>
</div>
</body>
</html>
