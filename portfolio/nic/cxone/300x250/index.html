      <meta http-equiv="X-UA-Compatible" content="IE=10" />
      <meta charset="UTF-8" />

      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/EasePack.min.js"></script>
<script>gsap.defaults({overwrite:"auto"});</script>



      <script>
         var clickTag = "https://www.niceincontact.com/";

         window.onload = function() {
            //console.log("window.onload()");

            initMouseEvents();

            resetBanner();
            resetTextFX();

            adVisible();
         };

         function adVisible() {
            //console.log("adVisible()");

            TweenLite.to("#banner", 0.25, { autoAlpha: 1 });

            startAnimation();
         }

         //------------------------------------------
         //      Mouse Events
         //------------------------------------------

         function initMouseEvents() {
            //console.log("initMouseEvents()");

            bindEvent(gEL("#banner"), "click", onBannerClick);

            bindEvent(gEL("#cta"), "mouseover", onCTAOver);
            bindEvent(gEL("#cta"), "mouseout", onCTAOut);
         }

         function onBannerClick(e) {
            //console.log("onBannerClick(e)");

            window.open(clickTag);
         }

         function onCTAOver(e) {
            //console.log("onCTAOver(e)");

            TweenLite.to("#cta_line", 0.25, { scaleX: 1, ease: Quad.easeInOut });
         }

         function onCTAOut(e) {
            //console.log("onCTAOut(e)");

            TweenLite.to("#cta_line", 0.25, { scaleX: 0, ease: Quad.easeInOut });
         }

         //------------------------------------------
         //      Animation
         //------------------------------------------

         var bannerWidth;
         var bannerHeight;

         var bkgrndScale1 = 1.3;
         var bkgrndScale2;
         var bkgrndScale15;

         var cd = 100;
         var circleAR = [
            { x: -cd, y: -cd },
            { x: -cd * 1.25, y: cd },
            { x: cd, y: -cd },
            { x: cd, y: cd },
         ];

         function resetBanner() {
            //console.log("resetBanner()");

            bannerWidth = gEL("#banner").offsetWidth;
            bannerHeight = gEL("#banner").offsetHeight;

            var bkgrndWidth = bannerWidth * bkgrndScale1;
            var bkgrndHeight = bannerHeight * bkgrndScale1;

            TweenLite.set(".bkgrnd", { width: bkgrndWidth + "px", height: bkgrndHeight + "px" });

            bkgrndScale2 = (bannerWidth / bkgrndWidth).toFixed(2);
            bkgrndScale15 = 1 - (1 - bkgrndScale2) * 0.9;
            //console.log("bkgrndScale2", bkgrndScale2, "bkgrndScale15", bkgrndScale15);

            TweenLite.set("#bkgrnd", { x: -75, y: -20 });
            TweenLite.set("#bkgrnd2", { autoAlpha: 0 });

            TweenLite.set("#cta", { autoAlpha: 0, y: "+=30" });

            TweenLite.set("#cta_line", { scaleX: 0, scaleY: 0.5 });

            var pathLength = 408;
            //var pathLength = Math.ceil(gEL("#ring").getTotalLength());
            //console.log("pathLength", pathLength);
            TweenLite.set("#ring", { strokeDasharray: pathLength, strokeDashoffset: pathLength, rotation: 45, transformOrigin: "50% 50%" });

            TweenLite.set(".circles", { x: -80, y: 0, scale: bkgrndScale1, transformOrigin: "50% 50%" });
            TweenLite.set(".circle", { transformOrigin: "50% 50%" });

            TweenLite.set(".circle1", { autoAlpha: 0.25 });
            TweenLite.set(".circle2", { autoAlpha: 0 });

            for (var a in circleAR) {
               var circleNum = parseInt(a) + 1;
               var props = { x: 0, y: 0, scale: 0, transformOrigin: "50% 50%" };
               TweenLite.set("#circle1_" + circleNum, props);
               TweenLite.set("#circle2_" + circleNum, props);
            }
         }

         function startAnimation() {
            //console.log("startAnimation()");

            /* FRAME 1 */

            var delay = 0;
            var rotation = 0;

            TweenLite.to("#bkgrnd", 1, { x: -40, y: -10, scale: 0.89, ease: Quad.easeInOut, delay: delay });

            delay += 0.5;
            TweenLite.delayedCall(delay, function() {
               revealText(fxAR[1]);
            });

            delay += 1.75;
            TweenLite.to("#txt1", 0.25, { autoAlpha: 0, delay: delay });

            /* FRAME 2 */

            // SHOW CIRCLES
            for (var a in circleAR) {
               var circleNum = parseInt(a) + 1;
               var props = { x: circleAR[a].x, y: circleAR[a].y, scale: 1.4, ease: Power2.easeIn, delay: delay - 0.5 };
               TweenLite.to("#circle1_" + circleNum, 1.5, props);
               TweenLite.to("#circle2_" + circleNum, 1.5, props);
            }

            rotation -= 360;
            TweenLite.to(".circles", 1.5, { rotation: rotation, ease: Power2.easeIn, delay: delay });

            // HIDE CIRCLES

            delay += 1.5;

            rotation -= 360;
            TweenLite.to(".circles", 1.5, { x: 0, y: 0, rotation: rotation, ease: Quad.easeOut, delay: delay });

            TweenLite.to(".circle1", 1.5, { autoAlpha: 0, ease: Quad.easeOut, delay: delay });
            TweenLite.to(".circle2", 1.5, { autoAlpha: 0.15, ease: Quad.easeOut, delay: delay });
            TweenLite.to(".circle", 1.25, { x: 0, y: 0, scale: 1, ease: Quad.easeOut, delay: delay });

            delay += 1;
            TweenLite.delayedCall(delay, function() {
               revealText(fxAR[2]);
            });

            TweenLite.to("#bkgrnd2", 1, { autoAlpha: 1, delay: delay });

            delay += 2;
            TweenLite.to("#txt2", 0.25, { autoAlpha: 0, delay: delay });

            TweenLite.to("#bkgrnd", 1, { x: 0, y: 0, scale: bkgrndScale2, ease: Quad.easeInOut, delay: delay });
            TweenLite.to(".circle2", 1, { autoAlpha: 0.5, ease: Quad.easeOut, delay: delay });

            /* FRAME 3 */

            delay += 0.25;
            TweenLite.delayedCall(delay, function() {
               revealText(fxAR[3]);
            });

            delay += 1;
            TweenLite.to("#cta", 0.5, { autoAlpha: 1, y: 0, delay: delay, ease: Quad.easeOut });

            TweenLite.to("#ring", 2, { strokeDashoffset: 0, delay: delay, ease: Quad.easeInOut });

            //delay += 2;
            //console.log("TOTAL BANNER ANIMATION SECONDS: " + delay);
         }

         //------------------------------------------
         //      Text Effect
         //------------------------------------------

         var fxAR = [];

         var debug = false;

         function resetTextFX() {
            //console.log("resetTextFX()");

            // [ x, y, w, h ]

            var fxOb = {
               id: "#txt1",
               src: "img_txt1.png",
               drawImg: false,
               boxesReveal: [
                  [17, 72, 115, 16],
                  [17, 89, 71, 18],
                  [17, 107, 67, 17],
                  [17, 125, 73, 18],
                  [17, 142, 94, 16],
               ],
            };
            newCanvasOb(fxOb);
            fxAR[1] = fxOb;

            var fxOb = {
               id: "#txt2",
               src: "img_txt2.png",
               drawImg: false,
               boxesReveal: [
                  [17, 73, 107, 17],
                  [17, 90, 90, 17],
                  [17, 107, 87, 17],
                  [17, 125, 49, 17],
                  [17, 142, 75, 17],
                  [17, 159, 57, 17],
               ],
            };
            newCanvasOb(fxOb);
            fxAR[2] = fxOb;

            var fxOb = {
               id: "#txt3",
               src: "img_txt3.png",
               drawImg: false,
               boxesReveal: [
                  [18, 70, 53, 17],
                  [18, 87, 60, 17],
                  [18, 104, 96, 17],
                  [18, 121, 104, 16],
                  [18, 137, 84, 16],
                  [18, 152, 74, 17],
               ],
            };
            newCanvasOb(fxOb);
            fxAR[3] = fxOb;
         }

         function revealText(fxOb) {
            //console.log("revealText()", fxOb);

            fxOb.renderAR = [];

            var widthAR = [];

            var partOb, aniTime;

            for (var a in fxOb.boxesReveal) {
               partOb = {};
               partOb.srcRect = fxOb.boxesReveal[a];

               widthAR.push(partOb.srcRect[2]);

               for (var b in partOb.srcRect) {
                  partOb.srcRect[b] *= fxOb.scale;
               }
               //console.log(partOb.srcRect);

               fxOb.renderAR.push(partOb);
            }

            var totalWidth = widthAR.reduce((a, b) => a + b, 0);
            var totalTime = (totalWidth / 100) * 0.15;
            //console.log("totalWidth", totalWidth, "totalTime", totalTime);

            var delay = 0;
            for (var a in fxOb.renderAR) {
               partOb = fxOb.renderAR[a];

               aniTime = totalTime * (partOb.srcRect[2] / totalWidth);
               //console.log("aniTime", aniTime);

               partOb.w = 0;

               TweenLite.to(partOb, aniTime, { w: partOb.srcRect[2], ease: Linear.easeNone, delay: delay });

               delay += aniTime * 0.75;
            }

            onRenderRevealText(fxOb);

            TweenLite.to(this, totalTime + delay + aniTime, { onUpdate: onRenderRevealText, onUpdateParams: [fxOb] });

            return delay;
         }

         function onRenderRevealText(fxOb) {
            //console.log("onRenderRevealText()", fxOb);

            fxOb.context.clearRect(0, 0, fxOb.width, fxOb.height);

            var partOb;

            for (var a in fxOb.renderAR) {
               partOb = fxOb.renderAR[a];

               fxOb.context.drawImage(fxOb.img, partOb.srcRect[0], partOb.srcRect[1], partOb.w, partOb.srcRect[3], partOb.srcRect[0], partOb.srcRect[1], partOb.w, partOb.srcRect[3]);
            }
         }

         function newCanvasOb(fxOb) {
            //console.log("newCanvasOb()", fxOb);

            var el = gEL(fxOb.id);
            el.innerHTML = "";
            el.style.backgroundPositionX = "-10000px";
            el.style.backgroundImage = "none";

            fxOb.scale = 2;

            fxOb.width = el.offsetWidth * fxOb.scale;
            fxOb.height = el.offsetHeight * fxOb.scale;

            fxOb.canvas = document.createElement("canvas");
            fxOb.canvas.width = fxOb.width;
            fxOb.canvas.height = fxOb.height;
            fxOb.canvas.style.width = el.offsetWidth + "px";
            fxOb.canvas.style.height = el.offsetHeight + "px";

            fxOb.context = fxOb.canvas.getContext("2d");

            el.appendChild(fxOb.canvas);

            fxOb.img = new Image();
            fxOb.img.src = fxOb.src;
            fxOb.img.onload = function() {
               if (fxOb.drawImg === true) {
                  fxOb.context.drawImage(fxOb.img, 0, 0);
               }
            };
         }

         //------------------------------------------
         //      Helpers
         //------------------------------------------

         function gEL(id) {
            return document.querySelector(id);
         }

         function bindEvent(el, eventName, eventHandler) {
            if (el.addEventListener) {
               el.addEventListener(eventName, eventHandler, false);
            } else if (el.attachEvent) {
               el.attachEvent("on" + eventName, eventHandler);
            }
         }
      </script>
      <style>
         html,
         body {
            width: 100%;
            height: 100%;
            margin: 0px;
            padding: 0px;
            background-color: #fff;
            text-decoration: none !important;
         }

         div,
         canvas,
         svg {
            position: absolute;
            transform: translatez(0);
            backface-visibility: hidden;
            background-position: 0px 0px;
            background-size: cover;
            background-repeat: no-repeat;
            pointer-events: none;
            user-select: none;
            transform-origin: 0%;
         }

         a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
         }

         #banner {
            background-color: #ccc;
            overflow: hidden;
            visibility: hidden;
            pointer-events: all;
            cursor: pointer;
         }

         #border {
            box-sizing: border-box;
            border: 1px solid #000;
         }

         .adsize {
            width: 300px;
            height: 250px;
            left: 0px;
            top: 0px;
            transform-origin: 50% 50%;
         }

         /* BKGRND */

         #bkgrnd {
            left: 0px;
            top: 0px;
            transform-origin: 0% 0%;
         }

         #bkgrnd1 {
            background-image: url("img_bkgrnd1.png");
         }

         #bkgrnd2 {
            background-image: url("img_bkgrnd2.png");
         }

         #bkgrnd3 {
            background-image: url("img_bkgrnd3.jpg");
         }

         /* ELEMENTS */

         #logo {
            background-image: url("img_logo.png");
         }

         #txt1 {
            background-image: url("img_txt1.png");
         }

         #txt2 {
            background-image: url("img_txt2.png");
         }

         #txt3 {
            background-image: url("img_txt3.png");
         }

         /* CIRCLES */

         .circles {
            width: 178px;
            height: 182px;
            left: 190px;
            top: 25px;
            transform-origin: 50% 50%;
            mix-blend-mode: normal;
            overflow: visible;
         }

         .circle {
            width: 178px;
            height: 182px;
            left: 0px;
            top: 0px;
            transform-origin: 50% 50%;
            mix-blend-mode: multiply;
         }

         #ring {
            stroke-width: 1.5px;
         }

         /* CTA 1 */

         .cta {
            width: 74px;
            height: 20px;
            left: 18px;
            top: 181px;
            border-radius: 50px;
            background-color: #e7268d;
            transform-origin: 50% 50%;
         }

         #cta {
            background-image: url("img_cta.png");
            background-position-y: 0px;
            pointer-events: all;
            cursor: pointer;
         }

         #cta_line {
            width: 60%;
            height: 1px;
            left: 20%;
            top: 75%;
            background-color: #fff;
            transform-origin: 50% 0%;
         }
      </style>
   </head>
