<!DOCTYPE html>
<html lang=en>
<head>
<title>160x600</title>
<meta name=ad.size content="width=160,height=600" />
<meta name=format-detection content="telephone=no" />
<meta charset=UTF-8 />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/EasePack.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/ScrambleTextPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/TextPlugin.min.js"></script>

<link href="https://fonts.googleapis.com/css?family=Muli:800" rel=stylesheet />
<link href="https://fonts.googleapis.com/css?family=Fira+Mono" rel=stylesheet />
<script>var clickTag="https://www.imperva.com";window.onload=function(){initMouseEvents();resetBanner();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1,onComplete:startAnimation});}
function initMouseEvents(){gEL("#banner").addEventListener("click",onBannerClick);}
function onBannerClick(e){window.open(clickTag);}
var adWidth=160;var adHeight=600;var textX=15;var barWidth=44;var ctaWidth=96;var ctaHeight=30;var logoWidth=104;function resetBanner(){initBoxes();initScramble("body");gEL("#body").classList="blur fadeout";TweenLite.set("#bar1",{left:adWidth+"px"});TweenLite.set("#bar2",{left:adWidth+44+"px",scaleX:10});TweenLite.set("#bg_white",{y:"100%"});TweenLite.set("#logo",{width:"0%",x:logoWidth/2+"px"});TweenLite.set("#logo_img",{x:"-50%"});TweenLite.set("#cta1",{left:adWidth+"px"});TweenLite.set("#cta2",{left:adWidth+"px",width:ctaWidth*10+"px"});}
function startAnimation(){var delay=0;TweenLite.delayedCall(delay,showBoxes);delay+=2.25;TweenLite.to("#bar1",0.5,{left:textX+"px",delay,ease:Quad.easeInOut});TweenLite.to("#bar2",0.5,{left:textX+barWidth+"px",delay,ease:Quad.easeOut});TweenLite.to("#bar2",0.75,{scaleX:0,delay,ease:Quad.easeOut});delay+=0.75;TweenLite.delayedCall(delay,showTitle);delay+=2;TweenLite.to("#bg_white",0.5,{y:"0%",delay});delay+=0.5;TweenLite.to("#logo",0.5,{width:logoWidth+"px",x:"0%",delay});TweenLite.to("#logo_img",0.5,{x:"0%",delay});delay+=0.5;TweenLite.to("#cta1",0.5,{left:textX+"px",delay});TweenLite.to("#cta2",0.5,{left:textX+ctaWidth-ctaHeight+"px",delay,ease:Quad.easeOut});TweenLite.to("#cta2",0.75,{width:ctaHeight+"px",delay,ease:Quad.easeOut});delay+=0.5;TweenLite.delayedCall(delay,function(){gEL("#body").classList="trans500";});TweenLite.to("#body",3,{delay,scrambleText:{chars:"upperAndLowerCase",revealDelay:0.5},onUpdate:fixScramble,onUpdateParams:["body"]});delay+=3;TweenLite.delayedCall(delay,function(){gEL("#cta1").classList="cta btnPulse";});}
var x=-39;var y=-22;var width=adWidth-x;var height=adHeight-y;var boxWidth=80;var boxHeight=75;var cols=Math.ceil(width/boxWidth);var rows=Math.ceil(height/boxHeight);function initBoxes(){var boxesHTML="";for(let col=1;col<=cols;col++){for(let row=1;row<=rows;row++){var boxHTML="<div id='box_"+row+"_"+col+"' class='box'></div>";boxesHTML+=boxHTML;}}
gEL("#boxes").innerHTML=boxesHTML;var startLeft=x+(cols-5)*boxWidth;for(let row=1;row<=rows;row++){for(let col=1;col<=cols;col++){var boxId="#box_"+row+"_"+col;var width=boxWidth+"px";var height=boxHeight+"px";var left=x+(col-1)*boxWidth;var top=y+(row-1)*boxHeight+"px";var evenRow=isEven(row);if(evenRow)left+=boxWidth*0.5;left+="px";TweenLite.set(boxId,{width,height,left,top,autoAlpha:0,scale:0});}}}
function showBoxes(){var startX=80;var startY=370;var delay=0;for(let row=1;row<=rows;row++){for(let col=1;col<=cols;col++){var boxId="#box_"+row+"_"+col;var boxX=gEL(boxId).offsetLeft;var boxY=gEL(boxId).offsetTop;var dist=Math.round(getDistance(boxX,boxY,startX,startY));var delay=(dist/100)*0.25;var endS=dist<110?1:0;TweenLite.to(boxId,0.75,{autoAlpha:1,scale:1.25,delay,ease:Quad.easeInOut});TweenLite.to(boxId,0.75,{scale:endS,delay:delay+0.75,ease:Quad.easeInOut});if(endS===0){TweenLite.to(boxId,0.75,{scale:endS,delay:delay+0.75,ease:Quad.easeInOut,onComplete:dEL,onCompleteParams:[boxId]});}else{TweenLite.to(boxId,0.75,{scale:endS,delay:delay+0.75,ease:Quad.easeInOut});}}}}
function showTitle(){var totalTime=2;var line1Txt="Secure Apps.";var line2Txt="Secure Data.";var line3Txt="Secure Growth.";var totalChars=line1Txt.length+line2Txt.length+line3Txt.length;var line1Time=+parseFloat((line1Txt.length/totalChars)*totalTime).toFixed(2);var line2Time=+parseFloat((line2Txt.length/totalChars)*totalTime).toFixed(2);var line3Time=+parseFloat((line3Txt.length/totalChars)*totalTime).toFixed(2);var delay=0.1;TweenLite.to("#title1",line1Time,{text:line1Txt,ease:Linear.easeNone,delay});delay+=parseFloat(line1Time);TweenLite.to("#title2",line2Time,{text:line2Txt,ease:Linear.easeNone,delay});delay+=parseFloat(line2Time);TweenLite.to("#title3",line3Time,{text:line3Txt,ease:Linear.easeNone,delay});}
var scrambleSpaceChars={};function initScramble(divId){scrambleSpaceChars[divId]=[];var textArr=gEL("#"+divId).innerHTML.split("");for(var a in textArr){if(textArr[a]===" "){scrambleSpaceChars[divId].push(parseInt(a));}}}
function fixScramble(divId){var text=gEL("#"+divId).innerHTML;for(var a in scrambleSpaceChars[divId]){var index=scrambleSpaceChars[divId][a];text=setCharAt(text,index," ");}
gEL("#"+divId).innerHTML=text;}
function gEL(id){return document.querySelector(id);}
function dEL(id){var el=gEL(id);el.parentElement.removeChild(el);}
function setCharAt(str,index,chr){if(index>str.length-1)return str;return str.substr(0,index)+chr+str.substr(index+1);}
function isEven(n){return n%2==0;}
function getDistance(x1,y1,x2,y2){var xs=x2-x1;var ys=y2-y1;xs*=xs;ys*=ys;return Math.sqrt(xs+ys);}</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,canvas{position:absolute;transform:translatez(0);backface-visibility:hidden;background-position:0 0;background-size:cover;background-repeat:no-repeat;pointer-events:none;user-select:none;transform-origin:0 0}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important}#banner{background-color:#fff;overflow:hidden;visibility:hidden;pointer-events:all;cursor:pointer}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:160px;height:600px;left:0;top:0}#bg_blue{background-color:#285ae6}#bg_white{width:160px;height:70px;left:0;top:530px;background-color:#fff}#bar1{width:88px;height:24px;left:15px;top:24px;background-color:#fff}#bar2{width:44px;height:12px;left:15px;top:24px;background:#fff;background:linear-gradient(90deg,rgba(255,255,255,1) 0,rgba(255,255,255,0) 100%)}.title{width:auto;height:auto;left:15px;color:#fff;font-size:18px;font-weight:800;text-align:left;font-family:"Muli",sans-serif}#title1{top:66px}#title2{top:88px}#title3{top:110px}#body{width:140px;height:auto;left:15px;top:148px;color:#fff;font-size:14px;line-height:18px;font-weight:normal;text-align:left;font-family:"Fira Mono",monospace;letter-spacing:-0.02em}.cta{width:96px;height:30px;left:15px;top:222px;border-radius:20px;background-color:#ffa06e}#cta1{border-radius:20px;background-image:url("img_cta.png");pointer-events:all;cursor:pointer}#cta1:hover{background-color:#fff}#cta2{background:#ffa06e;background:linear-gradient(90deg,rgba(255,160,110,1) 0,rgba(255,160,110,0) 100%)}.btnPulse{animation:btnPulse 1000ms 5}@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(255,160,110,0.7)}100%{box-shadow:0 0 0 10px rgba(255,160,110,0)}}#logo{width:104px;height:28px;left:26px;top:550px;overflow:hidden}#logo_img{width:104px;height:28px;left:0;top:0;background-image:url("img_logo.png")}.box{transform-origin:50% 50%;background-image:url("img_box.png")}.fadeout{opacity:0;visibility:hidden}.blur{-webkit-filter:blur(5px);filter:blur(5px)}.trans500{-webkit-transition:all 500ms ease-in-out;-moz-transition:all 500ms ease-in-out;-o-transition:all 500ms ease-in-out;transition:all 500ms ease-in-out}</style>
</head>
<body>
<div id=banner class=adsize>
<div id=bg_blue class=adsize></div>
<div id=bg_white></div>
<div id=boxes class=adsize></div>
<div id=bar1></div>
<div id=bar2></div>
<div id=title1 class=title></div>
<div id=title2 class=title></div>
<div id=title3 class=title></div>
<div id=body>See why 6,000+ global customers choose Imperva.</div>
<div id=logo><div id=logo_img></div></div>
<div id=cta2 class=cta></div>
<div id=cta1 class=cta></div>
</div>
<div id=border class=adsize></div>
</body>
</html>
