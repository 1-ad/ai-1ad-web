<script>var clickTag="https://www.imperva.com";window.onload=function(){initMouseEvents();resetBanner();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1,onComplete:startAnimation});}
function initMouseEvents(){gEL("#banner").addEventListener("click",onBannerClick);}
function onBannerClick(e){window.open(clickTag);}
var adWidth=728;var adHeight=90;var barHeight=80;var ctaX=604;var ctaWidth=96;var ctaHeight=30;var logoWidth=104;function resetBanner(){initBoxes();initScramble("body");gEL("#body").classList="blur fadeout";TweenLite.set("#bg_white",{y:"100%"});TweenLite.set("#logo",{width:"0%",x:logoWidth/2+"px"});TweenLite.set("#logo_img",{x:"-50%"});TweenLite.set("#bar1",{top:-barHeight+"px"});TweenLite.set("#bar2",{top:-barHeight+"px",scaleY:10});TweenLite.set("#cta1",{left:adWidth+"px"});TweenLite.set("#cta2",{left:adWidth+"px",width:ctaWidth*10+"px"});}
function startAnimation(){var delay=0;TweenLite.delayedCall(delay,showBoxes);delay+=0.75;TweenLite.delayedCall(delay,hideBoxes);delay+=1;TweenLite.delayedCall(delay,blinkCircle);delay+=0.5;TweenLite.to("#bg_white",0.5,{y:"0%",delay});delay+=0.5;TweenLite.to("#logo",0.5,{width:logoWidth+"px",x:"0%",delay});TweenLite.to("#logo_img",0.5,{x:"0%",delay});delay+=0.5;TweenLite.to("#bar1",0.5,{top:"15px",delay,ease:Quad.easeInOut});TweenLite.to("#bar2",0.5,{top:"15px",delay,ease:Quad.easeOut});TweenLite.to("#bar2",1,{scaleY:0,delay,ease:Quad.easeOut});delay+=0.5;TweenLite.delayedCall(delay,showTitle);delay+=2;TweenLite.to("#cta1",0.5,{left:ctaX+"px",delay});TweenLite.to("#cta2",0.5,{left:ctaX+ctaWidth-ctaHeight+"px",delay,ease:Quad.easeOut});TweenLite.to("#cta2",0.75,{width:ctaHeight+"px",delay,ease:Quad.easeOut});delay+=0.5;TweenLite.delayedCall(delay,function(){gEL("#body").classList="trans500";});TweenLite.to("#body",3,{delay,scrambleText:{chars:"upperAndLowerCase",revealDelay:0.5},onUpdate:fixScramble,onUpdateParams:["body"]});delay+=3;TweenLite.delayedCall(delay,function(){gEL("#cta1").classList="cta btnPulse";});}
var boxWidth=34;var boxHeight=34;var boxSpaceX=6;var boxSpaceY=6;var cols=Math.ceil(adWidth/(boxWidth-boxSpaceX));var rows=Math.ceil(adHeight/(boxHeight-boxSpaceY))-1;var boxesWidth=(boxWidth-boxSpaceX)*cols;var boxesHeight=(boxHeight-boxSpaceY)*rows;var boxesStartX=-3;var boxesStartY=0;var boxesAR=[];var maxDist=0;function initBoxes(){var boxesHTML="";for(let col=1;col<=cols;col++){for(let row=1;row<=rows;row++){var boxHTML="<div id='box_"+row+"_"+col+"' class='box'><div class='box_black'></div><div class='box_circle'></div></div>";boxesHTML+=boxHTML;}}
gEL("#boxes").innerHTML=boxesHTML;var centerX=0;var centerY=0;for(let row=1;row<=rows;row++){var boxOnY=boxesStartY+(row-1)*(boxHeight-boxSpaceY);for(let col=1;col<=cols;col++){var boxId="#box_"+row+"_"+col;var width=boxWidth+"px";var height=boxHeight+"px";var boxOnX=boxesStartX+(col-1)*(boxWidth-boxSpaceX);var angleRadians=Math.atan2(centerY-boxOnY,centerX-boxOnX);var dist=Math.round(getDistance(boxOnX,boxOnY,centerX,centerY));TweenLite.set(boxId,{width,height,left:boxOnX,top:boxOnY});var boxSquare=gEL(boxId).getElementsByClassName("box_black");TweenLite.set(boxSquare,{scaleX:0});var boxCircle=gEL(boxId).getElementsByClassName("box_circle");TweenLite.set(boxCircle,{scale:0});var name=row+"_"+col;var boxObj={boxId,boxOnX,boxOnY,dist,boxSquare,boxCircle,name};boxesAR.push(boxObj);}}}
function showBoxes(){boxesAR=boxesAR.sort(compare);for(var a in boxesAR){var boxObj=boxesAR[a];var delay=(boxObj.dist/100)*0.15;TweenLite.to(boxObj.boxCircle,0.25,{scale:1,delay:delay,ease:Quad.easeInOut});TweenLite.to(boxObj.boxSquare,0.25,{scaleX:1,delay:delay+0.5,ease:Quad.easeInOut});maxDist=Math.max(maxDist,boxObj.dist);}}
var keepAR=[];keepAR.push("1_20","1_21","1_22","1_23","1_24","1_25","1_26","1_27");keepAR.push("2_19","2_20","2_21","2_22","2_23","2_24","2_25","2_26","2_27");keepAR.push("3_18","3_19","3_20","3_21","3_22","3_23","3_24","3_25","3_26","3_27");function hideBoxes(){for(var a in boxesAR){var boxObj=boxesAR[a];var delay=(boxObj.dist/100)*0.15+0.25;if(!keepAR.includes(boxObj.name)){TweenLite.to(boxObj.boxId,0.5,{scale:0,delay,ease:Quad.easeIn,onComplete:dEL,onCompleteParams:[boxObj.boxId]});}}}
function blinkCircle(){var cicleEl=gEL("#box_3_20").getElementsByClassName("box_circle");var delay=0;for(let a=1;a<=5;a++){TweenLite.set(cicleEl,{backgroundColor:"#ffd66d",delay});delay+=0.1;TweenLite.set(cicleEl,{backgroundColor:"#fff",delay});delay+=0.1;}
TweenLite.set(cicleEl,{backgroundColor:"#ffd66d",delay});}
function showTitle(){var totalTime=2;var line1Txt="Pinpoint the real threats to your data.";var totalChars=line1Txt.length;var line1Time=parseFloat((line1Txt.length/totalChars)*totalTime).toFixed(2);var delay=0.1;TweenLite.to("#title1",line1Time,{text:line1Txt,ease:Linear.easeNone,delay});}
var scrambleSpaceChars={};function initScramble(divId){scrambleSpaceChars[divId]=[];var textArr=gEL("#"+divId).innerHTML.split("");for(var a in textArr){if(textArr[a]===" "){scrambleSpaceChars[divId].push(parseInt(a));}}}
function fixScramble(divId){var text=gEL("#"+divId).innerHTML;for(var a in scrambleSpaceChars[divId]){var index=scrambleSpaceChars[divId][a];text=setCharAt(text,index," ");}
gEL("#"+divId).innerHTML=text;}
function gEL(id){return document.querySelector(id);}
function dEL(id){var el=gEL(id);el.parentElement.removeChild(el);}
function setCharAt(str,index,chr){if(index>str.length-1)return str;return str.substr(0,index)+chr+str.substr(index+1);}
function getDistance(x1,y1,x2,y2){var xs=x2-x1;var ys=y2-y1;xs*=xs;ys*=ys;return Math.sqrt(xs+ys);}
function compare(a,b){if(a.dist<b.dist)return-1;if(a.dist>b.dist)return 1;return 0;}</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,canvas{position:absolute;transform:translatez(0);backface-visibility:hidden;background-position:0 0;background-size:cover;background-repeat:no-repeat;pointer-events:none;user-select:none;transform-origin:0 0}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important}#banner{background-color:#285ae6;overflow:hidden;visibility:hidden;pointer-events:all;cursor:pointer}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:728px;height:90px;left:0;top:0}#bg_white{width:154px;height:90px;left:574px;top:0;background-color:#fff}#bar1{width:24px;height:60px;left:20px;top:15px;background-color:#fff}#bar2{width:24px;height:60px;left:20px;top:15px;background:#fff;background:linear-gradient(0deg,rgba(255,255,255,1) 0,rgba(255,255,255,0) 100%);transform-origin:100% 100%}.title{width:auto;height:auto;left:64px;color:#fff;font-size:21px;font-weight:800;text-align:left;font-family:"Muli",sans-serif}#title1{top:10px}#body{width:410px;height:auto;left:64px;top:40px;color:#fff;font-size:13.5px;line-height:20px;font-weight:normal;text-align:left;font-family:"Fira Mono",monospace}.cta{width:96px;height:30px;left:604px;top:48px;border-radius:20px;background-color:#ffa06e}#cta1{border-radius:20px;background-image:url("img_cta.png");pointer-events:all;cursor:pointer}#cta1:hover{background-position:0 -30px;background-color:#285ae6}#cta2{background:#ffa06e;background:linear-gradient(90deg,rgba(255,160,110,1) 0,rgba(255,160,110,0) 100%)}.btnPulse{animation:btnPulse 1000ms 5}@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(255,160,110,0.7)}100%{box-shadow:0 0 0 10px rgba(255,160,110,0)}}#logo{width:104px;height:28px;left:600px;top:10px;overflow:hidden}#logo_img{width:104px;height:28px;left:0;top:0;background-image:url("img_logo.png")}#boxes{left:0;top:0;transform-origin:0 50%}.box{transform-origin:50% 50%;background-color:rgba(40,90,230,1)}.box_black{width:22px;height:22px;left:6px;top:6px;transform-origin:0 0;background-color:rgba(0,0,0,1)}.box_circle{width:10px;height:10px;left:12px;top:12px;border-radius:10px;transform-origin:50% 50%;background-color:rgba(255,255,255,1)}.fadeout{opacity:0;visibility:hidden}.blur{-webkit-filter:blur(5px);filter:blur(5px)}.trans500{-webkit-transition:all 500ms ease-in-out;-moz-transition:all 500ms ease-in-out;-o-transition:all 500ms ease-in-out;transition:all 500ms ease-in-out}</style>
