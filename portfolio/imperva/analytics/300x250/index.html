<script>var clickTag="https://www.imperva.com";window.onload=function(){initMouseEvents();resetBanner();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1,onComplete:startAnimation});}
function initMouseEvents(){gEL("#banner").addEventListener("click",onBannerClick);}
function onBannerClick(e){window.open(clickTag);}
var adWidth=300;var adHeight=250;var textX=15;var barWidth=44;var ctaWidth=74;var ctaHeight=25;var logoWidth=69;function resetBanner(){initBoxes();initScramble("body");gEL("#body").classList="blur fadeout";TweenLite.set("#bg_white",{y:"100%"});TweenLite.set("#boxes",{y:"0"});TweenLite.set("#logo",{width:"0%",x:logoWidth/2+"px"});TweenLite.set("#logo_img",{x:"-50%"});TweenLite.set("#bar1",{left:adWidth+"px"});TweenLite.set("#bar2",{left:adWidth+44+"px",scaleX:10});TweenLite.set("#cta1",{left:adWidth+"px"});TweenLite.set("#cta2",{left:adWidth+"px",width:ctaWidth*10+"px"});}
function startAnimation(){var delay=0;TweenLite.delayedCall(delay,showBoxes);delay+=0.75;TweenLite.delayedCall(delay,hideBoxes);delay+=1;TweenLite.delayedCall(delay,blinkCircle);delay+=0.5;TweenLite.to("#boxes",0.5,{y:"-22px",scale:1.11,delay});TweenLite.to("#bg_white",0.5,{y:"0%",delay});delay+=0.5;TweenLite.to("#logo",0.5,{width:logoWidth+"px",x:"0%",delay});TweenLite.to("#logo_img",0.5,{x:"0%",delay});delay+=0.5;TweenLite.to("#bar1",0.5,{left:textX+"px",delay,ease:Quad.easeInOut});TweenLite.to("#bar2",0.5,{left:textX+barWidth+"px",delay,ease:Quad.easeOut});TweenLite.to("#bar2",0.75,{scaleX:0,delay,ease:Quad.easeOut});delay+=0.5;TweenLite.delayedCall(delay,showTitle);delay+=2;TweenLite.to("#cta1",0.5,{left:textX+"px",delay});TweenLite.to("#cta2",0.5,{left:textX+ctaWidth-ctaHeight+"px",delay,ease:Quad.easeOut});TweenLite.to("#cta2",0.75,{width:ctaHeight+"px",delay,ease:Quad.easeOut});delay+=0.5;TweenLite.delayedCall(delay,function(){gEL("#body").classList="trans500";});TweenLite.to("#body",3,{delay,scrambleText:{chars:"upperAndLowerCase",revealDelay:0.5},onUpdate:fixScramble,onUpdateParams:["body"]});delay+=3;TweenLite.delayedCall(delay,function(){gEL("#cta1").classList="cta btnPulse";});}
var boxWidth=40;var boxHeight=40;var boxSpaceX=6;var boxSpaceY=6;var cols=Math.ceil(adWidth/boxWidth)+1;var rows=Math.ceil(adHeight/boxHeight);var boxesWidth=boxWidth*cols;var boxesHeight=boxHeight*rows;var boxesStartX=(adWidth-boxesWidth)/2;var boxesStartY=(adHeight-boxesHeight)/2;var boxesAR=[];var maxDist=0;function initBoxes(){var boxesHTML="";for(let col=1;col<=cols;col++){for(let row=1;row<=rows;row++){var boxHTML="<div id='box_"+row+"_"+col+"' class='box'><div class='box_black'></div><div class='box_circle'></div></div>";boxesHTML+=boxHTML;}}
gEL("#boxes").innerHTML=boxesHTML;var centerX=0;var centerY=0;for(let row=1;row<=rows;row++){var boxOnY=boxesStartY+(row-1)*boxHeight;for(let col=1;col<=cols;col++){var boxId="#box_"+row+"_"+col;var width=boxWidth+"px";var height=boxHeight+"px";var boxOnX=boxesStartX+(col-1)*boxWidth;var angleRadians=Math.atan2(centerY-boxOnY,centerX-boxOnX);var dist=Math.round(getDistance(boxOnX,boxOnY,centerX,centerY));TweenLite.set(boxId,{width,height,left:boxOnX,top:boxOnY});var boxSquare=gEL(boxId).getElementsByClassName("box_black");TweenLite.set(boxSquare,{scaleX:0});var boxCircle=gEL(boxId).getElementsByClassName("box_circle");TweenLite.set(boxCircle,{scale:0});var name=row+"_"+col;var boxObj={boxId,boxOnX,boxOnY,dist,boxSquare,boxCircle,name};boxesAR.push(boxObj);}}}
function showBoxes(){boxesAR=boxesAR.sort(compare);for(var a in boxesAR){var boxObj=boxesAR[a];var delay=(boxObj.dist/100)*0.15;TweenLite.to(boxObj.boxCircle,0.25,{scale:1,delay:delay,ease:Quad.easeInOut});TweenLite.to(boxObj.boxSquare,0.25,{scaleX:1,delay:delay+0.5,ease:Quad.easeInOut});maxDist=Math.max(maxDist,boxObj.dist);}}
var keepAR=[];keepAR.push("4_7","4_8");keepAR.push("5_6","5_7","5_8");keepAR.push("6_5","6_6","6_7","6_8");function hideBoxes(){for(var a in boxesAR){var boxObj=boxesAR[a];var delay=(boxObj.dist/100)*0.15+0.25;if(!keepAR.includes(boxObj.name)){TweenLite.to(boxObj.boxId,0.5,{scale:0,delay,ease:Quad.easeIn,onComplete:dEL,onCompleteParams:[boxObj.boxId]});}}}
function blinkCircle(){var cicleEl=gEL("#box_6_7").getElementsByClassName("box_circle");var delay=0;for(let a=1;a<=5;a++){TweenLite.set(cicleEl,{backgroundColor:"#ffd66d",delay});delay+=0.1;TweenLite.set(cicleEl,{backgroundColor:"#fff",delay});delay+=0.1;}
TweenLite.set(cicleEl,{backgroundColor:"#ffd66d",delay});}
function showTitle(){var totalTime=2;var line1Txt="Pinpoint";var line2Txt="the real threats";var line3Txt="to your data.";var totalChars=line1Txt.length+line2Txt.length+line3Txt.length;var line1Time=(line1Txt.length/totalChars)*totalTime;var line2Time=(line2Txt.length/totalChars)*totalTime;var line3Time=(line3Txt.length/totalChars)*totalTime;TweenLite.to("#title1",line1Time,{text:line1Txt,ease:Linear.easeNone});TweenLite.to("#title2",line2Time,{text:line2Txt,ease:Linear.easeNone,delay:line1Time});TweenLite.to("#title3",line3Time,{text:line3Txt,ease:Linear.easeNone,delay:line1Time+line2Time});}
var scrambleSpaceChars={};function initScramble(divId){scrambleSpaceChars[divId]=[];var textArr=gEL("#"+divId).innerHTML.split("");for(var a in textArr){if(textArr[a]===" "){scrambleSpaceChars[divId].push(parseInt(a));}}}
function fixScramble(divId){var text=gEL("#"+divId).innerHTML;for(var a in scrambleSpaceChars[divId]){var index=scrambleSpaceChars[divId][a];text=setCharAt(text,index," ");}
gEL("#"+divId).innerHTML=text;}
function gEL(id){return document.querySelector(id);}
function dEL(id){var el=gEL(id);el.parentElement.removeChild(el);}
function setCharAt(str,index,chr){if(index>str.length-1)return str;return str.substr(0,index)+chr+str.substr(index+1);}
function getDistance(x1,y1,x2,y2){var xs=x2-x1;var ys=y2-y1;xs*=xs;ys*=ys;return Math.sqrt(xs+ys);}
function compare(a,b){if(a.dist<b.dist)return-1;if(a.dist>b.dist)return 1;return 0;}</script>
<style>html,body{width:100%;height:100%;margin:0;padding:0;background-color:#fff;text-decoration:none!important}div,canvas{position:absolute;transform:translatez(0);backface-visibility:hidden;background-position:0 0;background-size:cover;background-repeat:no-repeat;pointer-events:none;user-select:none;transform-origin:0 0}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important}#banner{background-color:#285ae6;overflow:hidden;visibility:hidden;pointer-events:all;cursor:pointer}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:300px;height:250px;left:0;top:0}#bg_white{width:300px;height:30px;left:0;top:220px;background-color:#fff}#bar1{width:44px;height:12px;left:18px;top:14px;background-color:#fff}#bar2{width:44px;height:12px;left:18px;top:14px;background:#fff;background:linear-gradient(90deg,rgba(255,255,255,1) 0,rgba(255,255,255,0) 100%)}.title{width:auto;height:auto;left:15px;color:#fff;font-size:20px;font-weight:800;text-align:left;line-height:24px;font-family:"Muli",sans-serif}#title1{top:38px}#title2{top:62px}#title3{top:86px}#body{width:172px;height:auto;left:15px;top:122px;color:#fff;font-size:10px;line-height:14px;font-weight:normal;text-align:left;font-family:"Fira Mono",monospace;letter-spacing:-0.02em}.cta{width:74px;height:25px;left:15px;top:179px;border-radius:13px;background-color:#ffa06e}#cta1{border-radius:13px;background-image:url("img_cta.png");pointer-events:all;cursor:pointer}#cta1:hover{background-color:#fff}#cta2{background:#ffa06e;background:linear-gradient(90deg,rgba(255,160,110,1) 0,rgba(255,160,110,0) 100%)}.btnPulse{animation:btnPulse 1000ms 7}@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(255,160,110,0.6)}100%{box-shadow:0 0 0 10px rgba(255,160,110,0)}}#logo{width:69px;height:19px;left:222px;top:225px;overflow:hidden}#logo_img{width:69px;height:19px;left:0;top:0;background-image:url("img_logo.png")}#boxes{transform-origin:0 50%}.box{transform-origin:50% 50%;background-color:rgba(40,90,230,1)}.box_black{width:30px;height:30px;left:5px;top:5px;transform-origin:0 0;background-color:rgba(0,0,0,1)}.box_circle{width:14px;height:14px;left:13px;top:13px;border-radius:10px;transform-origin:50% 50%;background-color:rgba(255,255,255,1)}.fadeout{opacity:0;visibility:hidden}.blur{-webkit-filter:blur(5px);filter:blur(5px)}.trans500{-webkit-transition:all 500ms ease-in-out;-moz-transition:all 500ms ease-in-out;-o-transition:all 500ms ease-in-out;transition:all 500ms ease-in-out}</style>
