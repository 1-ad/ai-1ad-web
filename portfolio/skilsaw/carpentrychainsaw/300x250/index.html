<script>var clickTag="https://www.skilsaw.com";var bannerWidth;var bannerHeight;window.onload=function(){initMouseEvents();resetBanner();resetReveal();adVisible();};function adVisible(){TweenLite.to("#banner",0.25,{autoAlpha:1});startAnimation();}
function initMouseEvents(){bindEvent(gEL("#banner"),"click",onBannerClick);}
function onBannerClick(e){window.open(clickTag);}
function resetBanner(){resetLines();bannerWidth=gEL("#banner").offsetWidth;bannerHeight=gEL("#banner").offsetHeight;console.log("bannerWidth",bannerWidth,"bannerHeight",bannerHeight);TweenLite.set("#skilsaw",{autoAlpha:0,x:-82});TweenLite.set("#sawsquatch",{autoAlpha:0,rotation:-10});TweenLite.set("#wormdrive",{autoAlpha:0,scale:0});TweenLite.set("#product",{scale:0.38,x:120,y:-250});TweenLite.set("#cta",{x:-136});}
var lineAR=[89,48,119];function resetLines(){var lineElements=document.getElementsByClassName("line");for(var i=0;i<lineElements.length;i++){var el=lineElements.item(i);var pathLength=lineAR[i];TweenLite.set(el,{strokeDasharray:pathLength+","+pathLength+","+pathLength+","+pathLength});TweenLite.set(el,{strokeDashoffset:pathLength});}
console.log("lineAR",lineAR);}
function startAnimation(){var delay=0.25;TweenLite.to("#skilsaw",0.5,{autoAlpha:1,x:0,delay:delay,ease:Quad.easeOut});delay+=0.25;TweenLite.to("#sawsquatch",0.5,{autoAlpha:1,delay:delay});TweenLite.to("#sawsquatch",0.5,{rotation:0,delay:delay,ease:Bounce.easeOut});delay+=0.25;TweenLite.delayedCall(delay,function(){showText(txtAR[1]);});delay+=2;TweenLite.to("#txt1",0.25,{autoAlpha:0,delay:delay});TweenLite.to("#sawsquatch",0.25,{autoAlpha:0,delay:delay});TweenLite.to("#product",0.75,{y:18,delay:delay,ease:Quad.easeOut});TweenLite.to("#cta",0.5,{x:0,delay:delay,ease:Quad.easeOut});delay+=0.75;TweenLite.to("#line0",0.5,{strokeDashoffset:lineAR[0]*2,delay,ease:Quad.easeInOut});delay+=0.25;TweenLite.delayedCall(delay,function(){showText(txtAR[2]);});delay+=2;TweenLite.to("#line0",0.25,{strokeDashoffset:lineAR[0]*3,delay,ease:Quad.easeInOut});TweenLite.to("#txt2",0.25,{autoAlpha:0,delay:delay});delay+=0.25;TweenLite.to("#line1",0.5,{strokeDashoffset:lineAR[1]*2,delay,ease:Quad.easeInOut});delay+=0.25;TweenLite.delayedCall(delay,function(){showText(txtAR[3]);});delay+=2;TweenLite.to("#line1",0.25,{strokeDashoffset:lineAR[1]*3,delay,ease:Quad.easeInOut});TweenLite.to("#txt3",0.25,{autoAlpha:0,delay:delay});delay+=0.25;TweenLite.to("#product",0.5,{scale:1,x:-14,y:-207,delay:delay,ease:Quad.easeInOut});delay+=0.5;TweenLite.to("#line2",0.5,{strokeDashoffset:lineAR[2]*2,delay,ease:Quad.easeInOut});delay+=0.25;TweenLite.delayedCall(delay,function(){showText(txtAR[4]);});delay+=2;TweenLite.to("#line2",0.25,{strokeDashoffset:lineAR[2]*3,delay,ease:Quad.easeInOut});TweenLite.to("#txt4",0.25,{autoAlpha:0,delay:delay});delay+=0.25;TweenLite.to("#product",0.75,{scale:0.26,x:159,y:74,delay:delay,ease:Quad.easeInOut});delay+=0.25;TweenLite.to("#wormdrive",0.5,{scale:1,autoAlpha:1,delay:delay,ease:Quad.easeInOut});delay+=0.5;TweenLite.delayedCall(delay,function(){showText(txtAR[5]);});delay+=1;TweenLite.to("#cta_shine",0.5,{x:155,delay:delay,ease:Linear.easeNone});delay+=0.5;console.log("TOTAL BANNER ANIMATION SECONDS: "+delay);}
var tileWidth=4;var tileHeight=4;var canvasScale=2;var canvasWidth;var canvasHeight;var tempCanvas;var tempContext;var txtAR;var debug=false;function resetReveal(){canvasWidth=bannerWidth*canvasScale;canvasHeight=bannerHeight*canvasScale;tempCanvas=document.createElement("canvas");tempCanvas.width=canvasWidth;tempCanvas.height=canvasHeight;tempContext=tempCanvas.getContext("2d");txtAR=[];txtAR[1]=initText("txt1",[[51,152,198,18],[70,174,158,18],[29,196,241,18]]);txtAR[1].speed=0.5;buildTiles(txtAR[1]);txtAR[2]=initText("txt2",[[13,111,112,16],[13,129,124,16],[13,147,141,16]]);buildTiles(txtAR[2]);txtAR[3]=initText("txt3",[[14,111,78,16],[14,129,122,16]]);buildTiles(txtAR[3]);txtAR[4]=initText("txt4",[[13,100,162,16],[13,118,128,16],[13,136,48,16]]);buildTiles(txtAR[4]);txtAR[5]=initText("txt5",[[14,104,62,20],[14,126,132,21],[14,150,173,20]]);buildTiles(txtAR[5]);}
function initText(txtName,boxes){var img=new Image();img.src="img_"+txtName+".png";var txtOb={id:"#"+txtName,img:img,tileW:6,tileH:6,boxes:boxes,speed:1,};txtOb.renderCanvas=document.createElement("canvas");txtOb.renderCanvas.setAttribute("class","adsize");txtOb.renderCanvas.width=canvasWidth;txtOb.renderCanvas.height=canvasHeight;txtOb.renderContext=txtOb.renderCanvas.getContext("2d");var el=gEL(txtOb.id);el.innerHTML="";el.style.backgroundImage="none";el.appendChild(txtOb.renderCanvas);return txtOb;}
function buildTiles(txtOb){txtOb.renderAR=[];txtOb.maxDelay=0;var delay=0;for(var a in txtOb.boxes){var srcRect=txtOb.boxes[a];for(var b in srcRect){srcRect[b]*=canvasScale;}
var srcX=srcRect[0];var srcY=srcRect[1];var srcW=srcRect[2];var srcH=srcRect[3];var startX=srcX;var startY=srcY+srcH/2;var numOfColumns=Math.ceil(srcW/txtOb.tileW);var numOfRows=Math.ceil(srcH/txtOb.tileH);var tileOb,tileX,tileY,distance;for(var rowNum=0;rowNum<numOfRows;rowNum++){for(var colNum=0;colNum<numOfColumns;colNum++){tileX=Math.round(srcX+colNum*txtOb.tileW);tileY=Math.round(srcY+rowNum*txtOb.tileH);tileOb={};tileOb.x=tileX;tileOb.y=tileY;tileOb.boxNum=a;distance=getDistance(tileX,tileY,startX,startY);tileOb.delayMS=delay+Math.round(distance*txtOb.speed)+randRange(0,txtOb.speed*100);if(tileOb.delayMS>txtOb.maxDelay){txtOb.maxDelay=tileOb.delayMS;}
txtOb.renderAR.push(tileOb);}}
delay=txtOb.maxDelay;}
txtOb.maxDelay+=50;}
function showText(txtOb){txtOb.startMS=Date.now();txtOb.tw=TweenLite.to(this,txtOb.maxDelay/1000,{onUpdate:onRenderTiles,onUpdateParams:[txtOb]});}
function onRenderTiles(txtOb){var currentMS=Date.now();var currentBox=-1;for(var a in txtOb.renderAR){var tileOb=txtOb.renderAR[a];if(tileOb.boxNum!==currentBox){currentBox=tileOb.boxNum;var srcBox=txtOb.boxes[currentBox];txtOb.renderContext.restore();txtOb.renderContext.save();txtOb.renderContext.beginPath();txtOb.renderContext.rect(srcBox[0],srcBox[1],srcBox[2],srcBox[3]);txtOb.renderContext.clip();}
if(currentMS>txtOb.startMS+tileOb.delayMS){txtOb.renderContext.drawImage(txtOb.img,tileOb.x,tileOb.y,txtOb.tileW,txtOb.tileH,tileOb.x,tileOb.y,txtOb.tileW,txtOb.tileH);txtOb.renderAR.splice(a,1);}}}
function gEL(id){return document.querySelector(id);}
function bindEvent(el,eventName,eventHandler){if(el.addEventListener){el.addEventListener(eventName,eventHandler,false);}else if(el.attachEvent){el.attachEvent("on"+eventName,eventHandler);}}
function rEL(el){el.parentElement.removeChild(el);}
function randRange(min,max){return Math.floor(window.Math.seedRandom()*(max-min+1))+min;}
window.Math.seed=3;window.Math.seedRandom=function(max,min){max=max||1;min=min||0;Math.seed=(Math.seed*9301+49297)%233280;var rnd=Math.seed/233280;return min+rnd*(max-min);};function getDistance(x1,y1,x2,y2){var xs=x2-x1;var ys=y2-y1;xs*=xs;ys*=ys;return Math.sqrt(xs+ys);}</script>
