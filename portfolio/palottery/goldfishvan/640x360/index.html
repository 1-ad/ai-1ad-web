<!DOCTYPE html>

<head>

<style type=text/css>body{vertical-align:baseline;border:0 none;outline:0;padding:0;margin:0;left:0;top:0;width:100%;height:100%}div,img,canvas{position:absolute;user-select:none;background-position:0 0;background-size:cover;background-repeat:no-repeat;pointer-events:none}#ad-container{overflow:hidden;visibility:hidden;transform-origin:0 0;background-color:#000}#border{box-sizing:border-box;border:1px solid #000}.adsize{width:640px;height:360px;left:0;top:0}.video-container{background-color:#000}.video{width:100%;height:100%;pointer-events:auto;cursor:pointer}.video-container_slate{width:512px;height:288px;left:123px;top:5px}.video-playbutton{left:0;top:0;width:640px;height:360px;background-color:rgba(0,0,0,.5);visibility:hidden;pointer-events:auto;cursor:pointer}.loader{left:50%;top:50%;width:40px;height:40px;margin-left:-28px;margin-top:-28px;border:8px solid rgba(204,204,204,0.75);border-top:8px solid #fff;border-radius:50%;animation:loader_spin 2s linear infinite;pointer-events:none}@keyframes loader_spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.fadein{opacity:1;visibility:visible}.fadeout{opacity:0;visibility:hidden}#slate_bkgrnd{background-image:url("img_slate_bkgrnd.jpg");pointer-events:auto;cursor:pointer}#slate_mask{background-image:url("img_slate_mask.png")}#slate_overlay{background-image:url("img_slate_overlay.png")}#slate_goldfish{background-image:url("img_slate_goldfish.png")}.slate_goldfish_start{width:213px;height:182px;left:-213px;top:100px;-ms-transform:scale(.5,.5);-webkit-transform:scale(.5,.5);transform:scale(.5,.5)}.slate_goldfish_end{width:213px;height:182px;left:640px;top:50px;-ms-transform:scale(1,1);-webkit-transform:scale(1,1);transform:scale(1,1)}.slate_goldfish_trans{-webkit-transition:all 3000ms linear;-moz-transition:all 3000ms linear;-o-transition:all 3000ms linear;transition:all 3000ms linear}#slate_learnmore{width:160px;height:34px;left:299px;top:302px;background-color:#db0e2c;background-image:url("img_slate_learnmore.png");pointer-events:auto;cursor:pointer}#slate_learnmore:hover{background-color:#c40f29}</style>
</head>
<body>
<div id=ad-container class=adsize>
<div id=slate_bkgrnd class=adsize></div>
<div id=primary-video-container class="video-container video-container_slate">
<video id=primary-video class=video></video>
<div id=primary-loader class=loader></div>
</div>
<canvas id=particlesCanvas class=adsize width=640 height=360></canvas>
<div id=slate_mask class=adsize></div>
<div id=slate_goldfish class=slate_goldfish_start></div>
<div id=slate_overlay class=adsize></div>
<div id=slate_learnmore></div>

</div>
<script type=text/javascript>var ab;var primaryVideoControl;var goldFishWasShown=false;function onAdInit(){onAdSizeChange();window.addEventListener("resize",onAdSizeChange,true);initVideo();initMouseEvents();initParticles();gEL("#ad-container").style.visibility="visible";ab.ready()}function onAdVideoStart(){}function onAdVideoTimeUpdate(b,c){}function onAdVideoFirstQuartile(){}function onAdVideoMidpoint(){}function onAdVideoThirdQuartile(){}function onAdVideoComplete(){}function onAdVideoPlayComplete(){}function onAdVolumeChange(b){}function onAdPaused(){stopRender()}function onAdPlaying(){startRender()}function onAdSizeChange(b,c,d){resizeCreative(b,c,d)}function onAdUserClose(){}function onAdStopped(){stopRender()}function onAdExpandedChange(){}function onAdSkippableStateChange(){}function onAdSkipped(){}function onAdExtended(){}function onAdDurationChange(){}function onAdRemainingTimeChange(){}function initVideo(){var e=ab.getPrimaryVideoConfig();var b=gEL("#primary-video");var d=gEL("#primary-video-playbutton");var c=gEL("#primary-loader");primaryVideoControl=ab.addVideo(e,b,d,c);ab.addPrimaryVideoController(primaryVideoControl);b.addEventListener("playing",function(){startRender()});b.addEventListener("ended",function(){ab.stopAd()});primaryVideoControl.play()}function showView(){}function initMouseEvents(){gEL("#slate_bkgrnd").addEventListener("click",onBkgrndClick);gEL("#slate_learnmore").addEventListener("click",onLearnMoreClick);gEL("#slate_bkgrnd").addEventListener("mouseover",onBkgrndOver)}function onBkgrndClick(b){ab.openClickThru("slate/clickthru/bkgrnd")}function onLearnMoreClick(b){ab.openClickThru("slate/clickthru/learnmore")}function onBkgrndOver(b){console.log("onBkgrndOver()");if(goldFishWasShown!=true){goldFishWasShown=true;gEL("#slate_goldfish").className="slate_goldfish_end slate_goldfish_trans";gEL("#slate_bkgrnd").removeEventListener("mouseover",onBkgrndOver)}}var canvasWidth=640;var canvasHeight=360;var particlesCanvas;var particlesContext;var frameRate=1/24;var frameDelay=Math.round(frameRate*1000);var renderInterval;var renderAR=[];var particleImg;function initParticles(){particleImg=new Image();particleImg.onload=function(){particleLoaded()};particleImg.src="img_slate_bubble.png";particlesCanvas=document.getElementById("particlesCanvas");particlesContext=particlesCanvas.getContext("2d")}function particleLoaded(){renderAR=[];for(a=1;a<=10;a++){buildParticle(60)}for(a=1;a<=6;a++){buildParticle(610)}startRender()}function buildParticle(c){var b=numRange(1,6);var d={};d.img=particleImg;d.x=c+numRange(-8,8);d.y=numRange(-10,254);d.w=15-b;d.h=d.w;d.speedY=7-(b*0.5);d.rad=Math.PI;d.amt=numRange(100,200)/100;renderAR.push(d)}function moveParticles(){var c;for(var b in renderAR){c=renderAR[b];c.rad+=(c.amt/180)*Math.PI*2;c.x-=Math.cos(c.rad)*0.7;c.y-=c.speedY;if(c.y<-10){c.y=254}}}function startRender(){stopRender();onRender();renderInterval=setInterval(onRender,frameDelay)}function stopRender(){clearInterval(renderInterval)}function onRender(){moveParticles();particlesContext.clearRect(0,0,canvasWidth,canvasHeight);var c;for(var b in renderAR){c=renderAR[b];particlesContext.drawImage(c.img,c.x,c.y,c.w,c.h)}}document.body.onload=onWindowResize;window.addEventListener("resize",onWindowResize);function onWindowResize(){resizeCreative(window.innerWidth,window.innerHeight)}function resizeCreative(c,e,f){var h=640;var g=360;var c=window.innerWidth;var e=window.innerHeight;var b=Math.min(c/h,e/g);var d=Math.round((c-(h*b))/2);var i=Math.round((e-(g*b))/2);gEL("#ad-container").style.transform="scale("+b+", "+b+")";gEL("#ad-container").style.left=d+"px";gEL("#ad-container").style.top=i+"px"}function gEL(b){return document.querySelector(b)}function numRange(c,b){return Math.floor(Math.random()*(b-c+1))+c}</script>
<script type=text/javascript>window.addEventListener("load",function(){ab=adBridge;ab.on("AdInit",onAdInit);ab.on("AdVideoStart",onAdVideoStart);ab.on("AdVideoTimeUpdate",onAdVideoTimeUpdate);ab.on("AdVideoFirstQuartile",onAdVideoFirstQuartile);ab.on("AdVideoMidpoint",onAdVideoMidpoint);ab.on("AdVideoThirdQuartile",onAdVideoThirdQuartile);ab.on("AdVideoComplete",onAdVideoComplete);ab.on("AdVideoPlayComplete",onAdVideoPlayComplete);ab.on("AdVolumeChange",onAdVolumeChange);ab.on("AdPaused",onAdPaused);ab.on("AdPlaying",onAdPlaying);ab.on("AdSizeChange",onAdSizeChange);ab.on("AdUserClose",onAdUserClose);ab.on("AdStopped",onAdStopped);ab.on("AdExpandedChange",onAdExpandedChange);ab.on("AdSkippableStateChange",onAdSkippableStateChange);ab.on("AdSkipped",onAdSkipped);ab.on("AdExtended",onAdExtended);ab.on("AdDurationChange",onAdDurationChange);ab.on("AdRemainingTimeChange",onAdRemainingTimeChange);ab.pageLoaded()});</script>
</body>
</html>
